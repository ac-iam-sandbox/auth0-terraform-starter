vault_connections:
  auth0-m2m:
    app_id: "AUTH0"
    name: "Auth0 M2M Connection"
    environments: [dev, qa, val, prod]
    setup_static:
      type: "OAUTH_APP"
    setup_config:
      - "domain"
      - "client_id"
    setup_secrets:
      client_secret: "VAULT_AUTH0_CLIENT_SECRET"

flows: {}
forms: {}
