# Auth0 vault connection, flow, and form definitions.
# https://registry.terraform.io/providers/auth0/auth0/latest/docs/resources/flow_vault_connection
#
# environments: Optional list of envs where a resource should exist.
#               Omit = created in all environments.

vault_connections:
  auth0-m2m:
    app_id: "AUTH0"
    name: "Auth0 M2M Connection"
    setup_static:
      type: "OAUTH_APP"
    setup_config:
      - "domain"
      - "client_id"
    setup_secrets:
      client_secret: "VAULT_AUTH0_CLIENT_SECRET"

flows: {}
forms: {}
