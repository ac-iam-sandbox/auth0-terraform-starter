# Auth0 client grant definitions for platform ops.
# https://registry.terraform.io/providers/auth0/auth0/latest/docs/resources/client_grant
#
# Audience auto-resolves to Management API when omitted.
# "regions" filter: omit to deploy to all regions.
client_grants:
  branded-ui-service-mgmt-api:
    client_key: "branded-ui-service"
    environments: [dev, qa, val, prod]
    scopes:
      - "read:prompts"
      - "update:prompts"
      - "read:branding"
      - "update:branding"
      - "delete:branding"
      - "read:clients"
      - "update:clients"
      - "read:client_grants"

  auth0-actions-service-mgmt-api:
    client_key: "auth0-actions-service"
    environments: [dev, qa, val, prod]
    scopes:
      - "read:users"
      - "update:users"
      - "read:users_app_metadata"
      - "update:users_app_metadata"

  auth0-vault-service-mgmt-api:
    client_key: "auth0-vault-service"
    environments: [dev, qa, val, prod]
    scopes:
      - "read:users"
      - "update:users"
      - "read:users_app_metadata"
      - "update:users_app_metadata"
      - "read:email_provider"
      - "create:users_app_metadata"

  email-template-service-mgmt-api:
    client_key: "email-template-service"
    environments: [dev, qa, val, prod]
    scopes:
      - "read:email_templates"
      - "create:email_templates"
      - "update:email_templates"

  mulesoft-service-mgmt-api:
    client_key: "mulesoft-service"
    environments: [dev, qa, val, prod]
    scopes:
      - "update:users"
      - "create:user_tickets"
