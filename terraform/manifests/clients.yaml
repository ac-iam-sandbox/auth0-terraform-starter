# Auth0 M2M client definitions for platform ops.
# https://registry.terraform.io/providers/auth0/auth0/latest/docs/resources/client
#
# Filtering:
#   environments: Required — which envs this client exists in.
#   regions:      Optional — which regions this client exists in.
#                 Omit to deploy to ALL regions.
#
# Examples:
#   All regions, all envs:     environments: [dev, qa, val, prod]   (no regions key)
#   APAC only:                 environments: [dev, qa, val, prod]   regions: [apac]
#   NA + EU, dev only:         environments: [dev]                  regions: [na, eu]
clients:
  branded-ui-service:
    name: "Manage Branded UI Service App"
    description: "M2M app for external management of branding, universal login, and UI customization"
    environments: [dev, qa, val, prod]
    # regions: omitted — exists in all regions
    oidc_conformant: true
    is_first_party: true
    jwt_alg: "RS256"

  auth0-actions-service:
    name: "Auth0 Actions Service"
    description: "M2M app for action-based user lookups and account linking"
    environments: [dev, qa, val, prod]
    oidc_conformant: true
    is_first_party: true
    jwt_alg: "RS256"

  auth0-vault-service:
    name: "Auth0 Vault Service"
    description: "M2M app for vault connections — email provider config, user password and profile updates"
    environments: [dev, qa, val, prod]
    oidc_conformant: true
    is_first_party: true
    jwt_alg: "RS256"

  email-template-service:
    name: "Email Template Service"
    description: "M2M app for managing email templates"
    environments: [dev, qa, val, prod]
    oidc_conformant: true
    is_first_party: true
    jwt_alg: "RS256"

  mulesoft-service:
    name: "MuleSoft Service"
    description: "M2M app for proxying Management API calls from MuleSoft for user updates"
    environments: [dev, qa, val, prod]
    oidc_conformant: true
    is_first_party: true
    jwt_alg: "RS256"
