# Auth0 action module definitions (shared reusable code).
# https://registry.terraform.io/providers/auth0/auth0/latest/docs/resources/action_module
#
# publish: true creates an immutable version in Auth0.
# Actions always consume the latest published version.
# The promotion pipeline controls when higher environments see new module code.
#
# Same main.js / next.js / testing pattern as actions.
action_modules:
  auth-utils:
    name: "Auth Utilities"
    publish: true
    code: "main.js"
    dependencies:
      lodash: "4.17.21"
    secrets:
      - "AUTH_UTILS_INTERNAL_API_KEY"

  logging-helpers:
    name: "Logging Helpers"
    publish: true
    code: "main.js"
    dependencies: {}
    secrets: []
