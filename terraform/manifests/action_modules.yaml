# Auth0 action module definitions.
# https://registry.terraform.io/providers/auth0/auth0/latest/docs/resources/action_module
#
# environments: Required list of envs where this module should exist.
#               Every resource MUST have an explicit environments key.
#               Example: environments: [dev, qa]
#
# testing: Optional block to route specific envs to next.js during development.
#
# IMPORTANT: Pin all dependency versions. Never use "latest".
action_modules:
  entry-path-verification:
    name: "Entry Path Verification"
    publish: true
    environments: [dev, qa, val, prod]
    code: "main.js"
    dependencies: {}
    secrets_pipeline: []

  account-linking:
    name: "Account Linking"
    publish: true
    environments: [dev, qa, val, prod]
    code: "main.js"
    dependencies:
      auth0: "5.5.0"
    secrets_config:
      - "MANAGEMENT_API_DOMAIN"
      - "MANAGEMENT_API_CLIENT_ID"
    secrets_pipeline:
      - "MANAGEMENT_API_CLIENT_SECRET"

  signup-validation:
    name: "Signup Validation"
    publish: true
    environments: [dev, qa, val, prod]
    code: "main.js"
    dependencies:
      joi: "18.1.2"
      libphonenumber-js: "1.12.41"
    secrets_pipeline: []
