# Auth0 action module definitions.
# https://registry.terraform.io/providers/auth0/auth0/latest/docs/resources/action_module
#
# Env-specific config values reference keys from environments/{env}.yaml.
# Actual secrets come from pipeline variable groups (secrets_pipeline).
action_modules:
  entry-path-verification:
    name: "Entry Path Verification"
    publish: true
    code: "main.js"
    dependencies: {}
    secrets_config: {}
    secrets_pipeline: []

  account-linking:
    name: "Account Linking"
    publish: true
    code: "main.js"
    dependencies:
      auth0: "latest"
    # Keys reference values in environments/{env}.yaml
    secrets_config:
      MANAGEMENT_API_DOMAIN: "management_api_domain"
      MANAGEMENT_API_CLIENT_ID: "management_api_client_id"
    secrets_pipeline:
      - "MANAGEMENT_API_CLIENT_SECRET"

  signup-validation:
    name: "Signup Validation"
    publish: true
    code: "main.js"
    dependencies:
      joi: "latest"
      libphonenumber-js: "latest"
    secrets_config: {}
    secrets_pipeline: []
