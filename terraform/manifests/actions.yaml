# Auth0 action definitions.
# https://registry.terraform.io/providers/auth0/auth0/latest/docs/resources/action
#
# Each action has ONE canonical file: main.js
# During active development, a temporary next.js exists alongside it.
# The "testing" block controls which environments run next.js.
#
# To develop a new version of an action:
#   1. Create actions/<name>/next.js with new code
#   2. Add a testing block below with envs: ["dev"]
#   3. PR → merge → deploy-dev auto-runs
#   4. To promote: add envs to the list (e.g. ["dev", "qa"])
#   5. After full promotion: overwrite main.js with next.js content,
#      delete next.js, remove the testing block
actions:
  enrich-token:
    trigger: "post-login"
    trigger_version: "v3"
    runtime: "node18"
    deploy: true
    code: "main.js"
    dependencies:
      axios: "1.7.2"
    secrets:
      - "ENRICH_TOKEN_API_KEY"
    modules:
      - module_key: "auth-utils"
    # testing:                          # Uncomment when developing
    #   file: "next.js"
    #   envs: ["dev"]

  sync-user-metadata:
    trigger: "post-login"
    trigger_version: "v3"
    runtime: "node18"
    deploy: true
    code: "main.js"
    dependencies: {}
    secrets:
      - "SYNC_DB_CONN_STR"
    modules: []

  block-disposable-email:
    trigger: "pre-registration"
    trigger_version: "v2"
    runtime: "node18"
    deploy: true
    code: "main.js"
    dependencies:
      disposable-email-domains: "1.0.62"
    secrets: []
    modules: []

  log-login-event:
    trigger: "post-login"
    trigger_version: "v3"
    runtime: "node18"
    deploy: true
    code: "main.js"
    dependencies: {}
    secrets:
      - "LOG_LOGIN_ENDPOINT"
    modules:
      - module_key: "logging-helpers"
