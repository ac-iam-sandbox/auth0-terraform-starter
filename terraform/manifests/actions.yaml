# Auth0 action definitions.
# https://registry.terraform.io/providers/auth0/auth0/latest/docs/resources/action
#
# Trigger ordering: order of actions in this file = execution order per trigger.
# Env-specific config values reference keys from environments/{env}.yaml.
actions:
  enrich-signup-profile:
    name: "Enrich Signup Profile"
    trigger: "pre-user-registration"
    trigger_version: "v2"
    runtime: "node18"
    deploy: true
    code: "main.js"
    dependencies: {}
    # Key references value in environments/{env}.yaml
    secrets_config:
      API_BASE_URL: "api_base_url"
    secrets_pipeline: []
    modules:
      - module_key: "entry-path-verification"
      - module_key: "signup-validation"
