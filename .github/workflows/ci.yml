name: CI

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.tf'
      - 'environments/**'
      - 'modules/**'
      - 'actions/**'
      - 'README.md'
      - '.github/workflows/**'
  push:
    branches: [main, master, develop]
    paths:
      - '**.tf'
      - 'environments/**'
      - 'modules/**'
      - 'actions/**'
      - 'README.md'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build, test, lint, and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build actions
        working-directory: actions
        run: |
          npm ci
          npm run build

      - name: Run unit tests
        working-directory: actions
        run: |
          npm test

      - name: Run ESLint
        working-directory: actions
        run: |
          npm run lint

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.13.3'

      - name: Check Terraform formatting
        run: |
          for env in dev prod; do
            echo "Checking format for environments/$env"
            cd environments/$env
            terraform fmt -check -recursive -diff
            cd ../../
          done

      - name: Validate Terraform configurations
        run: |
          for env in dev prod; do
            echo "Validating environments/$env"
            cd environments/$env
            terraform init -backend=false -input=false -no-color
            terraform validate -no-color
            cd ../../
          done

      - name: Security scan with Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov
          checkov -d environments/ --framework terraform --soft-fail

      - name: Save build artifact for actions
        uses: actions/upload-artifact@v4
        with:
          name: actions-dist
          path: actions/dist
