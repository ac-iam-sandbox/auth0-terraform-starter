# Auth0 email provider — custom provider with SES backend.
#
# AUTH0_DOMAIN is auto-injected from data.auth0_tenant — no env YAML duplication.
# AUTH0_CLIENT_ID and AUTH0_CLIENT_SECRET are auto-resolved via client_refs.
#
# secrets_pipeline is a map: action_secret_name → pipeline_variable_name
# This allows the action code to use clean names (AWS_ACCESS_KEY_ID) while
# the pipeline uses prefixed names (SES_AWS_ACCESS_KEY_ID).
#
# Migration: set name to "ses" to deploy client+grant+action without switching.
# Then change to "custom" to activate. Revert by changing back to "ses".

email_provider:
  name: "custom"
  enabled: true
  default_from_address: "PLACEHOLDER_DEFAULT_FROM_ADDRESS"

  action:
    name: "Custom Email Provider"
    runtime: "node22"
    code: "main.js"
    dependencies:
      "@aws-sdk/client-sesv2": "3.1027.0"
    secrets_config:
      - "AWS_REGION"
    secrets_pipeline:
      AWS_ACCESS_KEY_ID: "SES_AWS_ACCESS_KEY_ID"
      AWS_SECRET_ACCESS_KEY: "SES_AWS_SECRET_ACCESS_KEY"
    client_refs:
      - secret_name: "AUTH0_CLIENT_ID"
        client_key: "custom-email-provider-service"
      - secret_name: "AUTH0_CLIENT_SECRET"
        client_key: "custom-email-provider-service"
        credential: "secret"
