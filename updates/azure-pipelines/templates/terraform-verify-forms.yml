# Verification step — run after plan to confirm form_refs resolve correctly.
# Add this as a one-time step in your pipeline during the migration.
# Remove after you've confirmed form_refs works.

parameters:
  - name: environment
    type: string

steps:
  - script: |
      set -euo pipefail
      cd $(Build.SourcesDirectory)/terraform

      echo "============================================================"
      echo " Form ID Resolution Verification (${{ parameters.environment }})"
      echo "============================================================"
      echo ""

      echo "=== 1. Form IDs from Terraform state (what form_refs resolves to) ==="
      terraform output -json form_ids 2>/dev/null | python3 -m json.tool || echo "  No forms in state yet"
      echo ""

      echo "=== 2. Action module IDs from Terraform state ==="
      terraform output -json action_module_ids 2>/dev/null | python3 -m json.tool || echo "  No action modules in state yet"
      echo ""

      echo "=== 3. Cross-reference: what each action will receive as secrets ==="
      # Parse the actions manifest and show which form_key maps to which form_id
      python3 - <<'PYEOF'
      import yaml, json, subprocess, sys

      # Load actions manifest
      with open("manifests/actions.yaml") as f:
          actions = yaml.safe_load(f).get("actions", {})

      # Get form IDs from state
      try:
          result = subprocess.run(
              ["terraform", "output", "-json", "form_ids"],
              capture_output=True, text=True, check=True
          )
          form_ids = json.loads(result.stdout)
      except Exception:
          print("  Could not read form_ids from state. Run after first apply.")
          sys.exit(0)

      print(f"  {'Action':<30} {'Secret Name':<25} {'Form Key':<25} {'Resolved ID'}")
      print(f"  {'-'*30} {'-'*25} {'-'*25} {'-'*30}")

      for action_key, action in actions.items():
          for ref in action.get("form_refs", []):
              form_key = ref["form_key"]
              secret_name = ref["secret_name"]
              resolved = form_ids.get(form_key, "MISSING!")
              status = "" if form_key in form_ids else " ← ERROR"
              print(f"  {action_key:<30} {secret_name:<25} {form_key:<25} {resolved}{status}")
      PYEOF

      echo ""
      echo "============================================================"
    displayName: "Verify form_refs resolution"
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
