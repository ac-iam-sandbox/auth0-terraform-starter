# This pipeline applies the Terraform plan generated by the terraform-plan.yml pipeline.
#
# The saved plan guarantees what was reviewed is exactly what gets applied.
# No -target hacks — Terraform handles dependency ordering automatically
# (action_modules are created/published before actions that reference them).

parameters:
  - name: environment
    type: string
  - name: region
    type: string
    default: "eu"

jobs:
  - deployment: apply
    displayName: "Apply infrastructure changes"
    environment: ${{ parameters.region }}-${{ parameters.environment }}-axon-cic
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - template: terraform-init.yml
              parameters:
                environment: ${{ parameters.environment }}

            - download: current
              artifact: ${{ parameters.region }}-${{ parameters.environment }}-plan

            - script: |
                set -o pipefail
                cd $(Build.SourcesDirectory)/terraform

                terraform apply \
                  -input=false \
                  -auto-approve \
                  "$(Pipeline.Workspace)/${{ parameters.region }}-${{ parameters.environment }}-plan/${{ parameters.environment }}.tfplan" \
                  2>&1 | tee $(Build.ArtifactStagingDirectory)/apply-output.txt

                exit_code=$?
                if [ $exit_code -ne 0 ]; then
                  echo "##vso[task.logissue type=error]Terraform apply failed with exit code $exit_code"
                  exit $exit_code
                fi
              displayName: "Terraform apply (saved plan)"
              env:
                AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
                TF_VAR_secrets_json: >-
                  {
                    "VAULT_AUTH0_CLIENT_SECRET": "$(VAULT_AUTH0_CLIENT_SECRET)",
                    "MANAGEMENT_API_CLIENT_SECRET": "$(MANAGEMENT_API_CLIENT_SECRET)",
                    "SES_AWS_SECRET_ACCESS_KEY": "$(SES_AWS_SECRET_ACCESS_KEY)"
                  }

            - publish: $(Build.ArtifactStagingDirectory)/apply-output.txt
              artifact: ${{ parameters.region }}-${{ parameters.environment }}-apply-output
              displayName: "Publish apply output"
              condition: always()
