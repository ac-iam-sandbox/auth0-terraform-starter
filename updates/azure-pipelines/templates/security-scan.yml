# This pipeline template defines security scanning and validation jobs for Terraform code.
# It includes Checkov for security scanning, tflint for linting, JavaScript syntax

jobs:
  - job: checkov
    displayName: "Checkov security scan"
    steps:
      - script: |
          pip install checkov==3.2.346 --quiet
          checkov \
            --directory $(Build.SourcesDirectory)/terraform \
            --framework terraform \
            --compact \
            --skip-check CKV_TF_1,CKV_TF_2 \
            --output cli \
            --output junitxml \
            --output-file-path $(Build.ArtifactStagingDirectory)
        displayName: "Run Checkov"

      - task: PublishTestResults@2
        displayName: "Publish Checkov results"
        condition: always()
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "$(Build.ArtifactStagingDirectory)/results_junitxml.xml"
          testRunTitle: "Checkov security scan"
          failTaskOnMissingResultsFile: false

  - job: tflint
    displayName: "Terraform lint"
    steps:
      - script: |
          TFLINT_VERSION="v0.53.0"
          curl -sLo /tmp/tflint.zip "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          unzip -o /tmp/tflint.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/tflint
          cd $(Build.SourcesDirectory)/terraform
          tflint --init || true
          tflint --recursive --format compact
        displayName: "Run tflint"

  - job: js_lint
    displayName: "Action code validation"
    steps:
      - script: |
          echo "Checking JavaScript syntax..."
          errors=0
          for f in $(find $(Build.SourcesDirectory)/terraform/actions $(Build.SourcesDirectory)/terraform/action_modules -name "*.js" 2>/dev/null); do
            node --check "$f" 2>&1 || errors=$((errors + 1))
          done
          if [ $errors -gt 0 ]; then
            echo "##[error]$errors JavaScript file(s) have syntax errors"
            exit 1
          fi
          echo "All JavaScript files passed syntax check"
        displayName: "Validate JS syntax"

  - job: manifest_validation
    displayName: "Manifest validation"
    steps:
      - script: |
          pip install pyyaml --quiet
          python $(Build.SourcesDirectory)/pipelines/scripts/validate-manifests.py \
            $(Build.SourcesDirectory)/terraform/manifests
        displayName: "Validate manifests"
