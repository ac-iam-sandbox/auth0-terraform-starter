parameters:
  - name: environment
    type: string
  - name: serviceConnection
    type: string
  - name: variableGroup
    type: string
  - name: envFolder
    type: string
  - name: varFile
    type: string
  - name: displayName
    type: string
  - name: isProduction
    type: boolean
    default: false
  - name: notifyUsers
    type: string
    default: 'team@example.com'

jobs:
  # ----------------------------------------
  # Job 1: Terraform Plan
  # ----------------------------------------
  - deployment: Plan${{ parameters.envFolder }}Environment
    displayName: 'Plan ${{ parameters.displayName }} Changes'
    environment: ${{ parameters.environment }}
    variables:
      - group: ${{ parameters.variableGroup }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - download: current
              artifact: actions-dist
              displayName: 'Download CI Build Artifacts'

            - script: |
                set -euo pipefail
                mkdir -p actions/dist
                cp -r "$(Pipeline.Workspace)/actions-dist/"* actions/dist/
                echo "✓ Actions restored from CI build"
              displayName: 'Restore Actions Build'

            - task: TerraformInstaller@1
              displayName: 'Install Terraform $(TF_VERSION)'
              inputs:
                terraformVersion: $(TF_VERSION)

            - task: AzureCLI@2
              displayName: 'Terraform Init & Plan'
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: 'bash'
                addSpnToEnvironment: true
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -euo pipefail

                  export ARM_CLIENT_ID=$servicePrincipalId
                  export ARM_TENANT_ID=$tenantId
                  export ARM_OIDC_TOKEN=$idToken
                  export ARM_USE_OIDC=true
                  export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                  echo "========================================"
                  echo "Service Connection Debug Info"
                  echo "========================================"
                  echo "Service Connection: ${{ parameters.serviceConnection }}"
                  echo "Client ID (SPN):    $servicePrincipalId"
                  echo "Tenant ID:          $tenantId"
                  echo "Subscription ID:    $ARM_SUBSCRIPTION_ID"
                  echo ""
                  echo "Logged in as:"
                  az account show --query '{name:name, user:user.name, type:user.type, subscriptionId:id}' -o table
                  echo ""
                  echo "Service Principal Object ID:"
                  az ad sp show --id $servicePrincipalId --query '{displayName:displayName, objectId:id, appId:appId}' -o table 2>/dev/null || echo "⚠ Could not query AD (may lack permissions)"
                  echo ""
                  echo "Checking RBAC on storage account $(ARM_STORAGE_ACCOUNT):"
                  az role assignment list \
                    --assignee $servicePrincipalId \
                    --scope "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$(ARM_RESOURCE_GROUP)/providers/Microsoft.Storage/storageAccounts/$(ARM_STORAGE_ACCOUNT)" \
                    --query '[].{role:roleDefinitionName, scope:scope}' \
                    -o table 2>/dev/null || echo "⚠ Could not list role assignments"
                  echo "========================================"

                  cd environments/${{ parameters.envFolder }}

                  echo "========================================"
                  echo "Terraform Init & Plan - ${{ parameters.displayName }}"
                  echo "========================================"
                  echo "Storage Account: $(ARM_STORAGE_ACCOUNT)"
                  echo "Container: $(ARM_CONTAINER_NAME)"
                  echo "========================================"

                  terraform init \
                    -backend-config="resource_group_name=$(ARM_RESOURCE_GROUP)" \
                    -backend-config="storage_account_name=$(ARM_STORAGE_ACCOUNT)" \
                    -backend-config="container_name=$(ARM_CONTAINER_NAME)" \
                    -backend-config="use_azuread_auth=true" \
                    -backend-config="use_oidc=true" \
                    -backend-config="client_id=$servicePrincipalId" \
                    -backend-config="tenant_id=$tenantId" \
                    -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
                    -input=false -no-color

                  echo ""
                  echo "Generating plan..."
                  terraform plan \
                    -input=false \
                    -no-color \
                    -lock-timeout=5m \
                    -var-file=${{ parameters.varFile }} \
                    -out=tfplan

                  echo ""
                  echo "Exporting plan for review..."
                  terraform show -json tfplan > "$(Build.ArtifactStagingDirectory)/${{ parameters.envFolder }}-plan.json"
                  terraform show -no-color tfplan > "$(Build.ArtifactStagingDirectory)/${{ parameters.envFolder }}-plan.txt"

                  echo ""
                  echo "✓ Plan generated and ready for review"
                  echo "========================================"
              env:
                TF_IN_AUTOMATION: '1'
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
                
            - publish: $(Build.ArtifactStagingDirectory)
              artifact: ${{ parameters.envFolder }}-plan
              displayName: 'Publish ${{ parameters.displayName }} Plan'

            - script: |
                set -euo pipefail
                cd environments/${{ parameters.envFolder }}
                mkdir -p "$(Build.ArtifactStagingDirectory)/plan-file"
                cp tfplan "$(Build.ArtifactStagingDirectory)/plan-file/tfplan"
              displayName: 'Prepare Plan File for Apply'

            - publish: $(Build.ArtifactStagingDirectory)/plan-file
              artifact: ${{ parameters.envFolder }}-plan-file
              displayName: 'Publish Plan File'

  # ----------------------------------------
  # Job 2: Manual Approval
  # ----------------------------------------
  - job: Approve${{ parameters.envFolder }}
    displayName: 'Approve ${{ parameters.displayName }} Deployment'
    dependsOn: Plan${{ parameters.envFolder }}Environment
    pool: server
    steps:
      - ${{ if parameters.isProduction }}:
        - task: ManualValidation@0
          displayName: 'Review ${{ parameters.displayName }} Plan & Approve'
          inputs:
            notifyUsers: ${{ parameters.notifyUsers }}
            instructions: |
              🚨 **PRODUCTION DEPLOYMENT APPROVAL REQUIRED** 🚨

              ⚠️ CRITICAL: This will apply changes to PRODUCTION

              Please carefully review the plan before approving:
              1. Download the '${{ parameters.envFolder }}-plan' artifact
              2. Thoroughly review ${{ parameters.envFolder }}-plan.txt for ALL planned changes
              3. Verify changes are expected, tested, and safe for production
              4. Confirm stakeholders have been notified
              5. Ensure rollback plan is in place
              6. Click 'Resume' ONLY if you approve the deployment

              Artifacts: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts
            onTimeout: 'reject'
      - ${{ else }}:
        - task: ManualValidation@0
          displayName: 'Review ${{ parameters.displayName }} Plan & Approve'
          inputs:
            notifyUsers: ${{ parameters.notifyUsers }}
            instructions: |
              ⚠️ **${{ parameters.displayName }} DEPLOYMENT APPROVAL REQUIRED**

              Please review the plan before approving:
              1. Download the '${{ parameters.envFolder }}-plan' artifact
              2. Review ${{ parameters.envFolder }}-plan.txt for planned changes
              3. Verify changes are expected and safe
              4. Click 'Resume' to proceed with deployment

              Artifacts: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts
            onTimeout: 'reject'

  # ----------------------------------------
  # Job 3: Terraform Apply
  # ----------------------------------------
  - deployment: Apply${{ parameters.envFolder }}Environment
    displayName: 'Apply ${{ parameters.displayName }} Changes'
    dependsOn: Approve${{ parameters.envFolder }}
    environment: ${{ parameters.environment }}
    variables:
      - group: ${{ parameters.variableGroup }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - download: current
              artifact: actions-dist
              displayName: 'Download CI Build Artifacts'

            - download: current
              artifact: ${{ parameters.envFolder }}-plan-file
              displayName: 'Download Plan File'

            - script: |
                set -euo pipefail
                mkdir -p actions/dist
                cp -r "$(Pipeline.Workspace)/actions-dist/"* actions/dist/
              displayName: 'Restore Actions Build'

            - task: TerraformInstaller@1
              displayName: 'Install Terraform $(TF_VERSION)'
              inputs:
                terraformVersion: $(TF_VERSION)

            - task: AzureCLI@2
              displayName: 'Terraform Init, Restore Plan & Apply'
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: 'bash'
                addSpnToEnvironment: true
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -euo pipefail

                  export ARM_CLIENT_ID=$servicePrincipalId
                  export ARM_TENANT_ID=$tenantId
                  export ARM_OIDC_TOKEN=$idToken
                  export ARM_USE_OIDC=true
                  export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                  cd environments/${{ parameters.envFolder }}

                  # Re-initialize Terraform
                  terraform init \
                    -backend-config="resource_group_name=$(ARM_RESOURCE_GROUP)" \
                    -backend-config="storage_account_name=$(ARM_STORAGE_ACCOUNT)" \
                    -backend-config="container_name=$(ARM_CONTAINER_NAME)" \
                    -backend-config="use_azuread_auth=true" \
                    -backend-config="use_oidc=true" \
                    -backend-config="client_id=$servicePrincipalId" \
                    -backend-config="tenant_id=$tenantId" \
                    -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
                    -input=false -no-color

                  # Restore the approved plan file
                  cp "$(Pipeline.Workspace)/${{ parameters.envFolder }}-plan-file/tfplan" .

                  echo "========================================"
                  echo "Terraform Apply - ${{ parameters.displayName }}"
                  echo "========================================"

                  terraform apply \
                    -input=false \
                    -no-color \
                    -lock-timeout=5m \
                    -auto-approve \
                    tfplan

                  echo ""
                  echo "✓ ${{ parameters.displayName }} deployment complete"
                  echo "========================================"
              env:
                TF_IN_AUTOMATION: '1'
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)

            - task: AzureCLI@2
              displayName: 'Capture Terraform Outputs'
              condition: succeededOrFailed()
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: 'bash'
                addSpnToEnvironment: true
                scriptLocation: 'inlineScript'
                inlineScript: |
                  export ARM_CLIENT_ID=$servicePrincipalId
                  export ARM_TENANT_ID=$tenantId
                  export ARM_OIDC_TOKEN=$idToken
                  export ARM_USE_OIDC=true
                  export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                  cd environments/${{ parameters.envFolder }}
                  terraform output -json > "$(Build.ArtifactStagingDirectory)/${{ parameters.envFolder }}-outputs.json"
                  terraform output -no-color > "$(Build.ArtifactStagingDirectory)/${{ parameters.envFolder }}-outputs.txt"

            - publish: $(Build.ArtifactStagingDirectory)
              artifact: ${{ parameters.envFolder }}-outputs
              displayName: 'Publish ${{ parameters.displayName }} Outputs'

            - ${{ if parameters.isProduction }}:
              - script: |
                  set -euo pipefail

                  echo "========================================"
                  echo "PRODUCTION DEPLOYMENT SUMMARY"
                  echo "========================================"
                  echo "Deployment ID: $(Build.BuildNumber)"
                  echo "Completed: $(date -u)"
                  echo "Deployed by: $(Build.RequestedFor)"
                  echo "Terraform Version: $(TF_VERSION)"
                  echo "========================================"
                  echo ""
                  echo "Next Steps:"
                  echo "1. Verify Auth0 tenant functionality"
                  echo "2. Check application integrations"
                  echo "3. Monitor Auth0 logs for errors"
                  echo "4. Notify stakeholders"
                  echo ""
                  echo "Rollback: git revert + redeploy if issues"
                  echo "========================================"
                displayName: 'Production Deployment Summary'