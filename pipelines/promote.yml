# Manual trigger to promote to qa, val, or prod.
# Creates one pipeline in Azure DevOps: "CIC - Promote"
# Pipelines → New Pipeline → GitHub → Existing YAML → pipelines/promote.yml
trigger: none

parameters:
  - name: target_environment
    displayName: "Target environment"
    type: string
    values:
      - qa
      - val
      - prod
  - name: region
    displayName: "Region"
    type: string
    default: "na"
    values:
      - na

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: ${{ parameters.region }}-${{ parameters.target_environment }}-axon-cic

stages:
  - stage: Plan
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          environment: ${{ parameters.target_environment }}
          region: ${{ parameters.region }}

  - stage: Apply
    dependsOn: Plan
    jobs:
      - template: templates/terraform-apply.yml
        parameters:
          environment: ${{ parameters.target_environment }}
          region: ${{ parameters.region }}
