# Manual trigger to promote to qa, val, or prod.
# Pipeline name in Azure DevOps: "Platform Ops - Promote"
trigger: none

parameters:
  - name: target_environment
    displayName: "Target environment"
    type: string
    values:
      - qa
      - val
      - prod
  - name: region
    displayName: "Region"
    type: string
    default: "na"
    values:
      - na

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: ${{ parameters.region }}-${{ parameters.target_environment }}-axon-platform-ops

stages:
  - stage: security_and_quality
    displayName: "Security & quality"
    jobs:
      - template: templates/security-scan.yml

  - stage: terraform_validation
    displayName: "Terraform validation"
    dependsOn: security_and_quality
    jobs:
      - template: templates/terraform-validate.yml
        parameters:
          environment: ${{ parameters.target_environment }}

  - stage: terraform_plan
    displayName: "Terraform plan (${{ parameters.region }}-${{ parameters.target_environment }})"
    dependsOn: terraform_validation
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          environment: ${{ parameters.target_environment }}
          region: ${{ parameters.region }}

  - stage: terraform_apply
    displayName: "Terraform apply (${{ parameters.region }}-${{ parameters.target_environment }})"
    dependsOn: terraform_plan
    jobs:
      - template: templates/terraform-apply.yml
        parameters:
          environment: ${{ parameters.target_environment }}
          region: ${{ parameters.region }}
