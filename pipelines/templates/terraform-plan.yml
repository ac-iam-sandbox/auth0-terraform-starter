parameters:
  - name: environment
    type: string
  - name: region
    type: string
    default: "na"
  - name: publish_binary_plan
    type: boolean
    default: true

jobs:
  - job: plan
    displayName: "Generate execution plan"
    steps:
      - template: terraform-init.yml
        parameters:
          environment: ${{ parameters.environment }}

      - script: |
          set -o pipefail
          cd $(Build.SourcesDirectory)/terraform
          terraform plan \
            -var="environment=${{ parameters.environment }}" \
            -out=$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}.tfplan \
            -input=false \
            2>&1 | tee $(Build.ArtifactStagingDirectory)/plan-output.log
        displayName: "Terraform plan"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AUTH0_DOMAIN: $(AUTH0_DOMAIN)
          AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
          AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
          TF_VAR_secrets_json: >-
            {
              "SES_ACCESS_KEY_ID": "$(SES_ACCESS_KEY_ID)",
              "SES_SECRET_ACCESS_KEY": "$(SES_SECRET_ACCESS_KEY)"
            }

      - script: |
          LOG="$(Build.ArtifactStagingDirectory)/plan-output.log"
          if grep -qiE '429|rate.limit|too many requests|throttl' "$LOG" 2>/dev/null; then
            echo "##[warning]Auth0 rate limiting detected during plan (${{ parameters.environment }})."
            grep -ciE '429|rate.limit|too many requests|throttl' "$LOG" | xargs -I{} echo "  {} occurrence(s) found"
          else
            echo "No rate limiting detected."
          fi
        displayName: "Check for rate limiting"
        condition: always()

      - script: |
          cd $(Build.SourcesDirectory)/terraform
          terraform show -no-color $(Build.ArtifactStagingDirectory)/${{ parameters.environment }}.tfplan \
            > $(Build.ArtifactStagingDirectory)/plan-summary.txt
        displayName: "Generate plan summary"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - script: |
          #!/bin/bash
          SUMMARY="$(Build.ArtifactStagingDirectory)/plan-summary.txt"
          ENV="${{ parameters.environment }}"

          echo ""
          echo "============================================================"
          echo " Plan Summary: ${ENV}"
          echo "============================================================"

          PLAN_LINE=$(grep -E '^Plan:|^No changes' "$SUMMARY" 2>/dev/null | tail -1)

          if echo "$PLAN_LINE" | grep -q "No changes"; then
            echo " Result: No changes. Infrastructure matches configuration."
            echo "============================================================"
            exit 0
          fi

          ADD=$(echo "$PLAN_LINE" | grep -oP '\d+ to add' | grep -oP '\d+' || echo "0")
          CHG=$(echo "$PLAN_LINE" | grep -oP '\d+ to change' | grep -oP '\d+' || echo "0")
          DEL=$(echo "$PLAN_LINE" | grep -oP '\d+ to destroy' | grep -oP '\d+' || echo "0")

          printf " %-12s %-8s\n" "Metric" "Count"
          printf " %-12s %-8s\n" "----------" "-----"
          printf " %-12s %-8s\n" "Add" "${ADD:-0}"
          printf " %-12s %-8s\n" "Change" "${CHG:-0}"
          printf " %-12s %-8s\n" "Destroy" "${DEL:-0}"
          echo ""

          echo " Changes by module:"
          grep -E '^\s+#' "$SUMMARY" 2>/dev/null | sed 's/^[[:space:]]*/  /' | head -30

          echo ""
          echo "============================================================"

          if [ "${DEL:-0}" -gt 0 ]; then
            echo "##[warning]Plan includes ${DEL} resource DESTRUCTION(s) in ${ENV}. Review carefully."
          fi

          if [ "${ENV}" = "prod" ] && [ "$((${ADD:-0} + ${CHG:-0} + ${DEL:-0}))" -gt 10 ]; then
            echo "##[warning]Large change set targeting prod. Consider splitting."
          fi
        displayName: "Plan summary table"
        condition: succeededOrFailed()

      - ${{ if eq(parameters.publish_binary_plan, true) }}:
        - publish: $(Build.ArtifactStagingDirectory)/${{ parameters.environment }}.tfplan
          artifact: ${{ parameters.region }}-${{ parameters.environment }}-plan
          displayName: "Publish plan artifact (sensitive)"

      - publish: $(Build.ArtifactStagingDirectory)/plan-summary.txt
        artifact: ${{ parameters.region }}-${{ parameters.environment }}-plan-summary
        displayName: "Publish plan summary"
