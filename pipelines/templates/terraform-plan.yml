parameters:
  - name: environment
    type: string
  - name: region
    type: string
    default: "na"

jobs:
  - job: plan
    displayName: "Plan (${{ parameters.region }}-${{ parameters.environment }})"
    steps:
      - template: terraform-init.yml
        parameters:
          environment: ${{ parameters.environment }}

      - script: |
          cd terraform
          terraform plan \
            -var="environment=${{ parameters.environment }}" \
            -out=${{ parameters.environment }}.tfplan \
            -input=false
        displayName: "Terraform plan"
        env:
          AUTH0_DOMAIN: $(AUTH0_DOMAIN)
          AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
          AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
          TF_VAR_secrets: $(TF_VAR_secrets)

      - publish: terraform/${{ parameters.environment }}.tfplan
        artifact: ${{ parameters.region }}-${{ parameters.environment }}-plan
        displayName: "Publish plan artifact"
