parameters:
  - name: environment
    type: string
  - name: region
    type: string
    default: "na"

jobs:
  - job: plan
    displayName: "Generate execution plan"
    steps:
      - template: terraform-init.yml
        parameters:
          environment: ${{ parameters.environment }}

      - script: |
          cd terraform
          terraform plan \
            -var="environment=${{ parameters.environment }}" \
            -out=${{ parameters.environment }}.tfplan \
            -input=false
        displayName: "Terraform plan"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AUTH0_DOMAIN: $(AUTH0_DOMAIN)
          AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
          AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
          # Secrets assembled from individual masked pipeline variables.
          # Add new entries here as you add secrets to your variable groups.
          TF_VAR_secrets_json: >-
            {
              "VAULT_AUTH0_CLIENT_SECRET": "$(VAULT_AUTH0_CLIENT_SECRET)"
            }

      - script: |
          cd terraform
          terraform show -no-color ${{ parameters.environment }}.tfplan > $(Build.ArtifactStagingDirectory)/plan-output.txt
        displayName: "Generate plan summary"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - publish: terraform/${{ parameters.environment }}.tfplan
        artifact: ${{ parameters.region }}-${{ parameters.environment }}-plan
        displayName: "Publish plan artifact"

      - publish: $(Build.ArtifactStagingDirectory)/plan-output.txt
        artifact: ${{ parameters.region }}-${{ parameters.environment }}-plan-summary
        displayName: "Publish plan summary"
