# =============================================================================
# Template: Deploy Environment (Terragrunt)
# =============================================================================
# Reusable deployment template for all environments.
# Flow: Install Tools → Plan → Publish Plan → Approve (via Environment) → Apply
#
# Approval gates are configured on the Azure DevOps Environment resource,
# NOT in this YAML. This template references the environment which triggers
# the configured approval checks automatically.
#
# Variable group must contain:
#   AUTH0_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET
#   ARM_TENANT_ID, ARM_SUBSCRIPTION_ID, ARM_RESOURCE_GROUP,
#   ARM_STORAGE_ACCOUNT, ARM_CONTAINER_NAME
# =============================================================================

parameters:
  - name: environment
    type: string
    displayName: 'Environment identifier (dev, qa, val, prod)'
  - name: environmentName
    type: string
    displayName: 'Environment display name (DEV, QA, VAL, PROD)'
  - name: variableGroup
    type: string
    displayName: 'Variable group name'
  - name: azureEnvironment
    type: string
    displayName: 'Azure DevOps environment name (controls approval gates)'
  - name: isProduction
    type: boolean
    default: false
    displayName: 'Is this a production deployment?'

jobs:
  # ========================================
  # Job 1: Plan Changes
  # ========================================
  - deployment: Plan${{ parameters.environmentName }}
    displayName: 'Plan ${{ parameters.environmentName }}'
    environment: ${{ parameters.azureEnvironment }}
    variables:
      - group: ${{ parameters.variableGroup }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - download: current
              artifact: actions-dist
              displayName: 'Download Actions Build'

            - script: |
                set -euo pipefail
                mkdir -p actions/dist
                cp -r "$(Pipeline.Workspace)/actions-dist/"* actions/dist/
              displayName: 'Restore Actions Build'

            - task: TerraformInstaller@1
              displayName: 'Install Terraform $(TF_VERSION)'
              inputs:
                terraformVersion: $(TF_VERSION)

            - script: |
                set -euo pipefail
                curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v$(TG_VERSION)/terragrunt_linux_amd64" \
                  -o /usr/local/bin/terragrunt
                chmod +x /usr/local/bin/terragrunt
                terragrunt --version
              displayName: 'Install Terragrunt'

            - script: |
                set -euo pipefail

                cd environments/${{ parameters.environment }}

                echo "========================================"
                echo "Terragrunt Plan - ${{ parameters.environmentName }}"
                echo "========================================"

                # Generate stack (creates unit directories from catalog)
                terragrunt stack generate 2>/dev/null || true

                # Run plan across all units
                terragrunt run --all -- plan \
                  -input=false \
                  -no-color \
                  -lock-timeout=5m \
                  -out=tfplan \
                  2>&1 | tee "$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}-plan.txt"

                echo ""
                echo "✓ Plan generated for ${{ parameters.environmentName }}"
              displayName: 'Terragrunt Plan'
              env:
                TF_IN_AUTOMATION: '1'
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
                ARM_TENANT_ID: $(ARM_TENANT_ID)
                ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
                ARM_RESOURCE_GROUP: $(ARM_RESOURCE_GROUP)
                ARM_STORAGE_ACCOUNT: $(ARM_STORAGE_ACCOUNT)
                ARM_CONTAINER_NAME: $(ARM_CONTAINER_NAME)

            - publish: $(Build.ArtifactStagingDirectory)
              artifact: ${{ parameters.environment }}-plan
              displayName: 'Publish ${{ parameters.environmentName }} Plan'

  # ========================================
  # Job 2: Manual Approval Gate
  # ========================================
  - job: Approve${{ parameters.environmentName }}
    displayName: 'Approve ${{ parameters.environmentName }}'
    dependsOn: Plan${{ parameters.environmentName }}
    pool: server
    steps:
      - task: ManualValidation@0
        displayName: 'Review & Approve ${{ parameters.environmentName }}'
        inputs:
          notifyUsers: |
            # TODO: Replace with your team's email addresses
            your-team@mycompany.com
          ${{ if eq(parameters.isProduction, true) }}:
            instructions: |
              **PRODUCTION DEPLOYMENT - REQUIRES 2 APPROVERS**

              1. Download the '${{ parameters.environment }}-plan' artifact
              2. Review ALL planned changes thoroughly
              3. Verify changes were tested in VAL
              4. Confirm rollback plan is in place
              5. Click 'Resume' ONLY if you approve

              Artifacts: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts
          ${{ else }}:
            instructions: |
              **${{ parameters.environmentName }} Deployment Approval**

              1. Download the '${{ parameters.environment }}-plan' artifact
              2. Review planned changes
              3. Click 'Resume' to proceed

              Artifacts: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts
          onTimeout: 'reject'

  # ========================================
  # Job 3: Apply Changes (after approval)
  # ========================================
  - deployment: Apply${{ parameters.environmentName }}
    displayName: 'Apply ${{ parameters.environmentName }}'
    dependsOn: Approve${{ parameters.environmentName }}
    environment: ${{ parameters.azureEnvironment }}
    variables:
      - group: ${{ parameters.variableGroup }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - download: current
              artifact: actions-dist
              displayName: 'Download Actions Build'

            - script: |
                set -euo pipefail
                mkdir -p actions/dist
                cp -r "$(Pipeline.Workspace)/actions-dist/"* actions/dist/
              displayName: 'Restore Actions Build'

            - task: TerraformInstaller@1
              displayName: 'Install Terraform $(TF_VERSION)'
              inputs:
                terraformVersion: $(TF_VERSION)

            - script: |
                set -euo pipefail
                curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v$(TG_VERSION)/terragrunt_linux_amd64" \
                  -o /usr/local/bin/terragrunt
                chmod +x /usr/local/bin/terragrunt
              displayName: 'Install Terragrunt'

            - script: |
                set -euo pipefail

                cd environments/${{ parameters.environment }}

                echo "========================================"
                echo "Terragrunt Apply - ${{ parameters.environmentName }}"
                echo "========================================"

                # Generate stack
                terragrunt stack generate 2>/dev/null || true

                # Apply all units
                terragrunt run --all -- apply \
                  -input=false \
                  -no-color \
                  -lock-timeout=5m \
                  -auto-approve

                echo ""
                echo "✓ ${{ parameters.environmentName }} deployment complete"
                echo "========================================"
              displayName: 'Terragrunt Apply'
              env:
                TF_IN_AUTOMATION: '1'
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
                ARM_TENANT_ID: $(ARM_TENANT_ID)
                ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
                ARM_RESOURCE_GROUP: $(ARM_RESOURCE_GROUP)
                ARM_STORAGE_ACCOUNT: $(ARM_STORAGE_ACCOUNT)
                ARM_CONTAINER_NAME: $(ARM_CONTAINER_NAME)

            - script: |
                set -euo pipefail
                cd environments/${{ parameters.environment }}

                echo "========================================"
                echo "Post-Deploy: ${{ parameters.environmentName }}"
                echo "========================================"
                echo "Build: $(Build.BuildNumber)"
                echo "Commit: $(Build.SourceVersion)"
                echo "Environment: ${{ parameters.environmentName }}"
                echo "Deployed by: $(Build.RequestedFor)"
                echo "========================================"
              displayName: 'Deployment Summary'
