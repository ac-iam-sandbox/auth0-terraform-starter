# =============================================================================
# Template: Deploy Environment (Terragrunt Stacks)
# =============================================================================
# Reusable plan -> OPA check -> approve -> apply template.
# Approvals are configured on Azure DevOps Environments, not here.
# Backend: AWS S3 with DynamoDB locking
# =============================================================================

parameters:
  - name: environment
    type: string
  - name: environmentName
    type: string
  - name: variableGroup
    type: string
  - name: azureEnvironment
    type: string
  - name: isProduction
    type: boolean
    default: false

jobs:
  # ========================================
  # Job 1: Plan + OPA Policy Check
  # ========================================
  - deployment: Plan${{ parameters.environmentName }}
    displayName: Plan ${{ parameters.environmentName }}
    environment: ${{ parameters.azureEnvironment }}
    variables:
      - group: ${{ parameters.variableGroup }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - download: current
              artifact: actions-dist
              displayName: Download CI Build Artifacts

            - script: |
                set -euo pipefail
                mkdir -p actions/dist
                cp -r "$(Pipeline.Workspace)/actions-dist/"* actions/dist/
                echo "✓ Actions restored from CI build"
              displayName: Restore Actions Build

            - task: TerraformInstaller@1
              displayName: Install Terraform
              inputs:
                terraformVersion: $(TF_VERSION)

            - script: |
                set -euo pipefail
                if ! curl -sSfL "https://github.com/gruntwork-io/terragrunt/releases/download/v$(TG_VERSION)/terragrunt_linux_amd64" \
                  -o /usr/local/bin/terragrunt; then
                  echo "ERROR: Failed to download Terragrunt v$(TG_VERSION)"
                  exit 1
                fi
                chmod +x /usr/local/bin/terragrunt
                terragrunt --version
              displayName: Install Terragrunt

            - script: |
                set -euo pipefail
                CONFTEST_URL="https://github.com/open-policy-agent/conftest/releases/download/v$(CONFTEST_VERSION)/conftest_$(CONFTEST_VERSION)_Linux_x86_64.tar.gz"
                curl -sL "$CONFTEST_URL" | tar xz -C /usr/local/bin conftest
              displayName: Install Conftest

            - script: |
                set -euo pipefail

                echo "========================================"
                echo "AWS Preflight Checks - ${{ parameters.environmentName }}"
                echo "========================================"

                echo "Verifying AWS credentials..."
                CALLER_IDENTITY=$(aws sts get-caller-identity)
                echo "Authenticated as: $(echo $CALLER_IDENTITY | jq -r .Arn)"

                BUCKET="$(TF_STATE_BUCKET)"
                echo ""
                echo "Checking S3 bucket: $BUCKET"

                VERSION_STATUS=$(aws s3api get-bucket-versioning \
                  --bucket "$BUCKET" \
                  --query 'Status' \
                  --output text 2>/dev/null || echo "None")

                if [ "$VERSION_STATUS" != "Enabled" ]; then
                  echo "WARNING: Bucket versioning is not enabled"
                fi
                echo "✓ Versioning: $VERSION_STATUS"

                echo ""
                echo "✓ All preflight checks passed"
                echo "========================================"
              displayName: 'Preflight: Verify AWS & S3'
              env:
                AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

            - script: |
                set -euo pipefail
                cd environments/${{ parameters.environment }}

                echo "========================================"
                echo "Terragrunt Plan - ${{ parameters.environmentName }}"
                echo "========================================"

                # Generate units in-place (no_dot_terragrunt_stack = true)
                terragrunt stack generate

                # Workaround: terragrunt expects .terragrunt-stack to exist
                # even when all units use no_dot_terragrunt_stack = true (known bug)
                mkdir -p .terragrunt-stack

                terragrunt run --all --non-interactive --no-color -- plan \
                  -input=false \
                  -lock-timeout=5m \
                  2>&1 | tee "$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}-plan.txt"
              displayName: Terragrunt Plan
              env:
                TF_IN_AUTOMATION: '1'
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
                AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

            - script: |
                set -euo pipefail
                cd environments/${{ parameters.environment }}

                echo "Running OPA policy checks..."
                POLICY_FAILURES=0

                # Run conftest against each unit's plan
                for unit_dir in $(find . -name tfplan -type f -exec dirname {} \;); do
                  echo "  Checking: $unit_dir"
                  cd "$unit_dir"
                  if terraform show -json tfplan > tfplan.json 2>/dev/null; then
                    conftest test tfplan.json --policy "$(Build.Repository.LocalPath)/policies/" --no-color || POLICY_FAILURES=$((POLICY_FAILURES + 1))
                  fi
                  cd "$(Build.Repository.LocalPath)/environments/${{ parameters.environment }}"
                done

                if [ $POLICY_FAILURES -gt 0 ]; then
                  echo "WARNING: $POLICY_FAILURES unit(s) had OPA policy violations"
                fi
              displayName: OPA Policy Check
              continueOnError: true
              env:
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
                AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

            - publish: $(Build.ArtifactStagingDirectory)
              artifact: ${{ parameters.environment }}-plan
              displayName: Publish ${{ parameters.environmentName }} Plan

  # ========================================
  # Job 2: Approve
  # ========================================
  - job: Approve${{ parameters.environmentName }}
    displayName: Approve ${{ parameters.environmentName }}
    dependsOn: Plan${{ parameters.environmentName }}
    pool: server
    steps:
      - task: ManualValidation@0
        displayName: Review and Approve ${{ parameters.environmentName }}
        inputs:
          notifyUsers: |
            your-team@mycompany.com
          ${{ if eq(parameters.isProduction, true) }}:
            instructions: |
              🚨 PRODUCTION DEPLOYMENT APPROVAL REQUIRED 🚨

              1. Download the '${{ parameters.environment }}-plan' artifact
              2. Thoroughly review planned changes
              3. Verify changes are expected, tested, and safe for production
              4. Confirm stakeholders have been notified
              5. Click Resume ONLY if you approve the deployment

              Artifacts: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts
          ${{ else }}:
            instructions: |
              ${{ parameters.environmentName }} Deployment Approval

              1. Download the '${{ parameters.environment }}-plan' artifact
              2. Review planned changes and OPA policy results
              3. Click Resume to proceed

              Artifacts: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts
          onTimeout: reject

  # ========================================
  # Job 3: Apply
  # ========================================
  - deployment: Apply${{ parameters.environmentName }}
    displayName: Apply ${{ parameters.environmentName }}
    dependsOn: Approve${{ parameters.environmentName }}
    environment: ${{ parameters.azureEnvironment }}
    variables:
      - group: ${{ parameters.variableGroup }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - download: current
              artifact: actions-dist
              displayName: Download CI Build Artifacts

            - script: |
                set -euo pipefail
                mkdir -p actions/dist
                cp -r "$(Pipeline.Workspace)/actions-dist/"* actions/dist/
              displayName: Restore Actions Build

            - task: TerraformInstaller@1
              displayName: Install Terraform
              inputs:
                terraformVersion: $(TF_VERSION)

            - script: |
                set -euo pipefail
                curl -sSfL "https://github.com/gruntwork-io/terragrunt/releases/download/v$(TG_VERSION)/terragrunt_linux_amd64" \
                  -o /usr/local/bin/terragrunt
                chmod +x /usr/local/bin/terragrunt
              displayName: Install Terragrunt

            - script: |
                set -euo pipefail
                cd environments/${{ parameters.environment }}

                echo "========================================"
                echo "Terragrunt Apply - ${{ parameters.environmentName }}"
                echo "========================================"

                terragrunt stack generate
                mkdir -p .terragrunt-stack

                terragrunt run --all --non-interactive --no-color -- apply \
                  -input=false \
                  -lock-timeout=5m \
                  -auto-approve
              displayName: Terragrunt Apply
              env:
                TF_IN_AUTOMATION: '1'
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
                AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

            - script: |
                echo "========================================"
                echo "Deployed: ${{ parameters.environmentName }}"
                echo "Build: $(Build.BuildNumber)"
                echo "Commit: $(Build.SourceVersion)"
                echo "========================================"
              displayName: Deployment Summary

            - script: |
                set -euo pipefail

                echo "========================================"
                echo "Smoke Test - ${{ parameters.environmentName }}"
                echo "========================================"

                HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                  "https://${AUTH0_DOMAIN}/authorize?response_type=code&client_id=test&redirect_uri=https://example.com")

                if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 500 ]; then
                  echo "FAIL: Tenant unreachable (HTTP $HTTP_STATUS)"
                  exit 1
                fi
                echo "PASS: Tenant reachable (HTTP $HTTP_STATUS)"

                TOKEN_RESPONSE=$(curl -s --request POST \
                  --url "https://${AUTH0_DOMAIN}/oauth/token" \
                  --header 'content-type: application/json' \
                  --data "{
                    \"client_id\": \"${AUTH0_CLIENT_ID}\",
                    \"client_secret\": \"${AUTH0_CLIENT_SECRET}\",
                    \"audience\": \"https://${AUTH0_DOMAIN}/api/v2/\",
                    \"grant_type\": \"client_credentials\"
                  }")

                TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
                if [ -z "$TOKEN" ]; then
                  echo "FAIL: Failed to obtain Management API token"
                  echo "$TOKEN_RESPONSE" | jq .
                  exit 1
                fi
                echo "PASS: Management API token obtained"

                echo ""
                echo "========================================"
                echo "All smoke tests passed - ${{ parameters.environmentName }}"
                echo "========================================"
              displayName: Post-Deploy Smoke Test
              continueOnError: true
              env:
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
