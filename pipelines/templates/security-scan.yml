# Security scanning and code quality checks.
# Runs checkov for Terraform security, tflint for Terraform linting,
# and basic JS syntax validation for action code.
jobs:
  - job: checkov
    displayName: "Checkov security scan"
    steps:
      - script: |
          pip install checkov --quiet
          checkov \
            --directory terraform \
            --framework terraform \
            --soft-fail \
            --compact \
            --skip-check CKV_TF_1 \
            --output cli \
            --output junitxml \
            --output-file-path . \
            || true
        displayName: "Run Checkov"

      - task: PublishTestResults@2
        displayName: "Publish Checkov results"
        condition: always()
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "**/results_junitxml.xml"
          testRunTitle: "Checkov security scan"
          failTaskOnMissingResultsFile: false

  - job: tflint
    displayName: "Terraform lint"
    steps:
      - script: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          cd terraform
          tflint --init || true
          tflint --recursive --format compact || true
        displayName: "Run tflint"

  - job: js_lint
    displayName: "Action code validation"
    steps:
      - script: |
          echo "Checking JavaScript syntax..."
          errors=0
          for f in $(find terraform/actions terraform/action_modules -name "*.js" 2>/dev/null); do
            node --check "$f" 2>&1 || errors=$((errors + 1))
          done
          if [ $errors -gt 0 ]; then
            echo "##[error]$errors JavaScript file(s) have syntax errors"
            exit 1
          fi
          echo "All JavaScript files passed syntax check"
        displayName: "Validate JS syntax"
