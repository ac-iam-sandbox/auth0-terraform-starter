# This pipeline applies the Terraform plan generated by the terraform-plan.yml pipeline.

parameters:
  - name: environment
    type: string
  - name: region
    type: string
    default: "na"

jobs:
  - deployment: apply
    displayName: "Apply infrastructure changes"
    environment: ${{ parameters.region }}-${{ parameters.environment }}-axon-cic
    strategy:
      runOnce:
        deploy:
          steps:
            # Deployment jobs do not auto-checkout source code.
            - checkout: self

            - template: terraform-init.yml
              parameters:
                environment: ${{ parameters.environment }}

            - download: current
              artifact: ${{ parameters.region }}-${{ parameters.environment }}-plan

            - script: |
                cd $(Build.SourcesDirectory)/terraform
                terraform apply \
                  -input=false \
                  $(Pipeline.Workspace)/${{ parameters.region }}-${{ parameters.environment }}-plan/${{ parameters.environment }}.tfplan \
                  2>&1 | tee $(Build.ArtifactStagingDirectory)/apply-output.txt
              displayName: "Terraform apply"
              env:
                AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
                TF_VAR_secrets_json: >-
                  {
                    "VAULT_AUTH0_CLIENT_SECRET": "$(VAULT_AUTH0_CLIENT_SECRET)",
                    "MANAGEMENT_API_CLIENT_SECRET": "$(MANAGEMENT_API_CLIENT_SECRET)"
                  }

            - publish: $(Build.ArtifactStagingDirectory)/apply-output.txt
              artifact: ${{ parameters.region }}-${{ parameters.environment }}-apply-output
              displayName: "Publish apply output"
              condition: always()
