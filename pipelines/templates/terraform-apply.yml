# Uses Azure DevOps Environments for approval gates + exclusive locks.
# https://learn.microsoft.com/en-us/azure/devops/pipelines/process/environments
parameters:
  - name: environment
    type: string
  - name: region
    type: string
    default: "na"

jobs:
  - deployment: apply
    displayName: "Apply infrastructure changes"
    environment: ${{ parameters.region }}-${{ parameters.environment }}-axon-cic
    strategy:
      runOnce:
        deploy:
          steps:
            - template: terraform-init.yml
              parameters:
                environment: ${{ parameters.environment }}

            - download: current
              artifact: ${{ parameters.region }}-${{ parameters.environment }}-plan

            - script: |
                cd terraform
                terraform apply \
                  -input=false \
                  $(Pipeline.Workspace)/${{ parameters.region }}-${{ parameters.environment }}-plan/${{ parameters.environment }}.tfplan
              displayName: "Terraform apply"
              env:
                AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
                # Secrets assembled from individual masked pipeline variables.
                # Must match the plan template exactly.
                TF_VAR_secrets_json: >-
                  {
                    "VAULT_AUTH0_CLIENT_SECRET": "$(VAULT_AUTH0_CLIENT_SECRET)"
                  }
