# Azure DevOps Environments provide approval gates + exclusive locks.
# https://learn.microsoft.com/en-us/azure/devops/pipelines/process/environments
#
# Create environments manually in Azure DevOps:
#   Pipelines → Environments → New Environment
#   Names: na-dev-axon-cic, na-qa-axon-cic, na-val-axon-cic, na-prod-axon-cic
#   Then configure approvals and exclusive locks on each.
parameters:
  - name: environment
    type: string
  - name: region
    type: string
    default: "na"

jobs:
  - deployment: apply
    displayName: "Apply (${{ parameters.region }}-${{ parameters.environment }})"
    environment: ${{ parameters.region }}-${{ parameters.environment }}-axon-cic
    strategy:
      runOnce:
        deploy:
          steps:
            - template: terraform-init.yml
              parameters:
                environment: ${{ parameters.environment }}

            - download: current
              artifact: ${{ parameters.region }}-${{ parameters.environment }}-plan

            - script: |
                cd terraform
                terraform apply \
                  -input=false \
                  $(Pipeline.Workspace)/${{ parameters.region }}-${{ parameters.environment }}-plan/${{ parameters.environment }}.tfplan
              displayName: "Terraform apply"
              env:
                AUTH0_DOMAIN: $(AUTH0_DOMAIN)
                AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
                AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
                TF_VAR_secrets: $(TF_VAR_secrets)
