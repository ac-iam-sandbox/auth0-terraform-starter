parameters:
  - name: region
    type: string
  - name: environment
    type: string

steps:
  - task: TerraformInstaller@1
    displayName: "Install Terraform"
    inputs:
      terraformVersion: "1.14.8"

  - script: |
      cd $(Build.SourcesDirectory)/terraform
      terraform init \
        -backend-config="bucket=$(TF_STATE_BUCKET)" \
        -backend-config=backends/${{ parameters.region }}-${{ parameters.environment }}.s3.tfbackend \
        -reconfigure
    displayName: "Terraform init (${{ parameters.region }}-${{ parameters.environment }})"
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
