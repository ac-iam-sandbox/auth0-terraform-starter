# Terraform Init Template
# This template initializes Terraform for the specified environment.

parameters:
  - name: environment
    type: string

steps:
  - task: TerraformInstaller@1
    displayName: "Install Terraform"
    inputs:
      terraformVersion: "1.12.0"

  - script: |
      cd $(Build.SourcesDirectory)/terraform
      terraform init \
        -backend-config="bucket=$(TF_STATE_BUCKET)" \
        -backend-config=backends/${{ parameters.environment }}.s3.tfbackend \
        -reconfigure
    displayName: "Terraform init (${{ parameters.environment }})"
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
