parameters:
  - name: region
    type: string

jobs:
  - job: post_comment
    displayName: "Post plan summary to PR"
    condition: and(succeededOrFailed(), eq(variables['Build.Reason'], 'PullRequest'))
    steps:
      - download: current
        artifact: ${{ parameters.region }}-dev-plan-summary
        displayName: "Download dev plan summary"
        continueOnError: true

      - download: current
        artifact: ${{ parameters.region }}-qa-plan-summary
        displayName: "Download qa plan summary"
        continueOnError: true

      - script: |
          #!/bin/bash
          set -euo pipefail

          REGION="${{ parameters.region }}"
          WORKSPACE="$(Pipeline.Workspace)"

          extract_counts() {
            local file="$1"
            if [ ! -f "$file" ]; then echo "-- Plan not available"; return; fi
            local summary
            summary=$(grep -E 'Plan:|No changes' "$file" | tail -1)
            if echo "$summary" | grep -q "No changes"; then
              echo "No changes"
            elif echo "$summary" | grep -q "Plan:"; then
              local add=$(echo "$summary" | grep -oP '\d+ to add' | grep -oP '\d+' || echo "0")
              local change=$(echo "$summary" | grep -oP '\d+ to change' | grep -oP '\d+' || echo "0")
              local destroy=$(echo "$summary" | grep -oP '\d+ to destroy' | grep -oP '\d+' || echo "0")
              echo "+${add:-0} ~${change:-0} -${destroy:-0}"
            else
              echo "-- Could not parse"
            fi
          }

          DEV=$(extract_counts "$WORKSPACE/${REGION}-dev-plan-summary/plan-summary.txt")
          QA=$(extract_counts "$WORKSPACE/${REGION}-qa-plan-summary/plan-summary.txt")

          BODY="## Platform Ops — ${REGION^^} Plan Summary\\n\\n"
          BODY+="| Environment | Result |\\n|---|---|\\n"
          BODY+="| **${REGION}-dev** | ${DEV} |\\n"
          BODY+="| **${REGION}-qa** | ${QA} |\\n"
          BODY+="| **${REGION}-val** | _promote only_ |\\n"
          BODY+="| **${REGION}-prod** | _promote only_ |\\n\\n"
          BODY+="---\\n*Pipeline: [$(Build.BuildNumber)]($(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId))*"

          PR_ID="$(System.PullRequest.PullRequestId)"
          API_URL="$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullRequests/${PR_ID}/threads?api-version=7.0"

          PAYLOAD="{\"comments\":[{\"parentCommentId\":0,\"content\":\"${BODY}\",\"commentType\":1}],\"status\":1}"

          curl -s -o /dev/null -w "" \
            -X POST "$API_URL" \
            -H "Authorization: Bearer $(System.AccessToken)" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "##[warning]Failed to post PR comment."
        displayName: "Post plan summary to PR"
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
