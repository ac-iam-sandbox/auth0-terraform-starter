# ONE-TIME import pipeline for bootstrapping existing Auth0 resources into Terraform state.
# Pipeline name in Azure DevOps: "Platform Ops - Import Dev (one-time)"
#
# Where to find IDs:
#   Clients:           Dashboard → Applications → click app → Settings → Client ID
#   Client grants:     Dashboard → Applications → APIs → Expand the API → grant ID
#   Singletons:        Import using a random string (tenant, attack_protection, guardian, email_provider)
trigger: none

parameters:
  # Singletons (import with random string)
  - name: import_tenant
    displayName: "Import tenant settings?"
    type: boolean
    default: true
  - name: import_attack_protection
    displayName: "Import attack protection?"
    type: boolean
    default: true
  - name: import_email_provider
    displayName: "Import email provider?"
    type: boolean
    default: true
  - name: import_guardian
    displayName: "Import Guardian MFA?"
    type: boolean
    default: true

  # Clients
  - name: client_email_template_service
    displayName: "Client ID: email-template-service"
    type: string
    default: "SKIP"
  - name: client_branded_ui_service
    displayName: "Client ID: branded-ui-service"
    type: string
    default: "SKIP"

  # Client grants
  - name: grant_email_template_service_mgmt_api
    displayName: "Grant ID: email-template-service-mgmt-api"
    type: string
    default: "SKIP"
  - name: grant_branded_ui_service_mgmt_api
    displayName: "Grant ID: branded-ui-service-mgmt-api"
    type: string
    default: "SKIP"

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: na-dev-axon-platform-ops

stages:
  - stage: import
    displayName: "Import existing resources"
    jobs:
      - job: terraform_import
        displayName: "Import into Terraform state"
        steps:
          - template: templates/terraform-init.yml
            parameters:
              environment: dev

          - script: |
              #!/bin/bash
              set -euo pipefail
              cd $(Build.SourcesDirectory)/terraform

              imported=0
              skipped=0
              failed=0

              import_resource() {
                local address="$1"
                local id="$2"
                local label="$3"

                if [ "$id" = "SKIP" ]; then
                  echo "⏭  SKIP: $label"
                  skipped=$((skipped + 1))
                  return
                fi

                echo ""
                echo "━━━ Importing: $label ━━━"
                echo "  Address: $address"
                echo "  ID:      $id"

                if terraform import \
                  -var="environment=dev" \
                  "$address" "$id" 2>&1; then
                  echo "  ✓ Imported successfully"
                  imported=$((imported + 1))
                else
                  echo "##[warning]  ✗ Import failed for $label ($id)"
                  failed=$((failed + 1))
                fi
              }

              echo "╔══════════════════════════════════════════════════╗"
              echo "║  Platform Ops Dev Import                        ║"
              echo "╚══════════════════════════════════════════════════╝"
              echo ""

              # Singletons
              echo "── Singleton resources"
              if [ "${{ parameters.import_tenant }}" = "True" ]; then
                import_resource 'module.tenant.auth0_tenant.this' \
                  "existing-tenant" "tenant"
              fi
              if [ "${{ parameters.import_attack_protection }}" = "True" ]; then
                import_resource 'module.attack_protection.auth0_attack_protection.this' \
                  "existing-attack-protection" "attack_protection"
              fi
              if [ "${{ parameters.import_email_provider }}" = "True" ]; then
                import_resource 'module.email_provider.auth0_email_provider.this' \
                  "existing-email-provider" "email_provider"
              fi
              if [ "${{ parameters.import_guardian }}" = "True" ]; then
                import_resource 'module.guardian.auth0_guardian.this' \
                  "existing-guardian" "guardian"
              fi

              # Clients
              echo ""
              echo "── Clients"
              import_resource 'module.clients.auth0_client.this["email-template-service"]' \
                "${{ parameters.client_email_template_service }}" "email-template-service"
              import_resource 'module.clients.auth0_client.this["branded-ui-service"]' \
                "${{ parameters.client_branded_ui_service }}" "branded-ui-service"

              # Client grants
              echo ""
              echo "── Client grants"
              import_resource 'module.client_grants.auth0_client_grant.this["email-template-service-mgmt-api"]' \
                "${{ parameters.grant_email_template_service_mgmt_api }}" "email-template-service-mgmt-api"
              import_resource 'module.client_grants.auth0_client_grant.this["branded-ui-service-mgmt-api"]' \
                "${{ parameters.grant_branded_ui_service_mgmt_api }}" "branded-ui-service-mgmt-api"

              # Summary
              echo ""
              echo "╔══════════════════════════════════════════════════╗"
              echo "║  Import Summary                                 ║"
              echo "╠══════════════════════════════════════════════════╣"
              printf "║  Imported: %-38s║\n" "$imported"
              printf "║  Skipped:  %-38s║\n" "$skipped"
              printf "║  Failed:   %-38s║\n" "$failed"
              echo "╚══════════════════════════════════════════════════╝"

              if [ "$failed" -gt 0 ]; then
                echo "##[warning]$failed import(s) failed. Review the output above."
              fi
            displayName: "Import resources"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
              AUTH0_DOMAIN: $(AUTH0_DOMAIN)
              AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
              AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
              TF_VAR_secrets_json: >-
                {
                  "SES_ACCESS_KEY_ID": "$(SES_ACCESS_KEY_ID)",
                  "SES_SECRET_ACCESS_KEY": "$(SES_SECRET_ACCESS_KEY)"
                }

  - stage: verify
    displayName: "Verify with plan"
    dependsOn: import
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          environment: dev
          region: na
          publish_binary_plan: false
