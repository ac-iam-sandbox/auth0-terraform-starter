# ONE-TIME import pipeline for bootstrapping existing Auth0 resources.
# Pipeline name in Azure DevOps: "Platform Ops - Import (one-time)"
trigger: none

parameters:
  - name: region
    displayName: "Region"
    type: string
    values:
      - na
      - apac
      - eu
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - dev
      - qa
      - val
      - prod

  # ── Singletons ──
  - name: import_tenant
    displayName: "Import tenant?"
    type: boolean
    default: true
  - name: import_attack_protection
    displayName: "Import attack protection?"
    type: boolean
    default: true
  - name: import_email_provider
    displayName: "Import email provider?"
    type: boolean
    default: true
  - name: import_guardian
    displayName: "Import Guardian MFA?"
    type: boolean
    default: true

  # ── Clients ──
  - name: client_branded_ui_service
    displayName: "Client ID: branded-ui-service"
    type: string
    default: "SKIP"
  - name: client_auth0_actions_service
    displayName: "Client ID: auth0-actions-service"
    type: string
    default: "SKIP"
  - name: client_auth0_vault_service
    displayName: "Client ID: auth0-vault-service"
    type: string
    default: "SKIP"
  - name: client_email_template_service
    displayName: "Client ID: email-template-service"
    type: string
    default: "SKIP"
  - name: client_mulesoft_service
    displayName: "Client ID: mulesoft-service"
    type: string
    default: "SKIP"

  # ── Client grants ──
  - name: grant_branded_ui_service
    displayName: "Grant ID: branded-ui-service-mgmt-api"
    type: string
    default: "SKIP"
  - name: grant_auth0_actions_service
    displayName: "Grant ID: auth0-actions-service-mgmt-api"
    type: string
    default: "SKIP"
  - name: grant_auth0_vault_service
    displayName: "Grant ID: auth0-vault-service-mgmt-api"
    type: string
    default: "SKIP"
  - name: grant_email_template_service
    displayName: "Grant ID: email-template-service-mgmt-api"
    type: string
    default: "SKIP"
  - name: grant_mulesoft_service
    displayName: "Grant ID: mulesoft-service-mgmt-api"
    type: string
    default: "SKIP"

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: ${{ parameters.region }}-${{ parameters.environment }}-axon-platform-ops

stages:
  - stage: import
    displayName: "Import (${{ parameters.region }}-${{ parameters.environment }})"
    jobs:
      - job: terraform_import
        displayName: "Import into Terraform state"
        steps:
          - template: templates/terraform-init.yml
            parameters:
              region: ${{ parameters.region }}
              environment: ${{ parameters.environment }}

          - script: |
              #!/bin/bash
              set -euo pipefail
              cd $(Build.SourcesDirectory)/terraform

              imported=0; skipped=0; failed=0

              import_resource() {
                local address="$1" id="$2" label="$3"
                if [ "$id" = "SKIP" ]; then
                  echo "⏭  SKIP: $label"; skipped=$((skipped + 1)); return
                fi
                echo ""; echo "━━━ Importing: $label ━━━"
                if terraform import \
                  -var="region=${{ parameters.region }}" \
                  -var="environment=${{ parameters.environment }}" \
                  "$address" "$id" 2>&1; then
                  echo "  ✓ Imported"; imported=$((imported + 1))
                else
                  echo "##[warning]  ✗ Failed: $label"; failed=$((failed + 1))
                fi
              }

              echo "╔══════════════════════════════════════════════════╗"
              echo "║  Import: ${{ parameters.region }}-${{ parameters.environment }}"
              echo "╚══════════════════════════════════════════════════╝"

              # Singletons
              [ "${{ parameters.import_tenant }}" = "True" ] && \
                import_resource 'module.tenant.auth0_tenant.this' "existing" "tenant"
              [ "${{ parameters.import_attack_protection }}" = "True" ] && \
                import_resource 'module.attack_protection.auth0_attack_protection.this' "existing" "attack_protection"
              [ "${{ parameters.import_email_provider }}" = "True" ] && \
                import_resource 'module.email_provider.auth0_email_provider.this' "existing" "email_provider"
              [ "${{ parameters.import_guardian }}" = "True" ] && \
                import_resource 'module.guardian.auth0_guardian.this' "existing" "guardian"

              # Clients
              import_resource 'module.clients.auth0_client.this["branded-ui-service"]' \
                "${{ parameters.client_branded_ui_service }}" "branded-ui-service"
              import_resource 'module.clients.auth0_client.this["auth0-actions-service"]' \
                "${{ parameters.client_auth0_actions_service }}" "auth0-actions-service"
              import_resource 'module.clients.auth0_client.this["auth0-vault-service"]' \
                "${{ parameters.client_auth0_vault_service }}" "auth0-vault-service"
              import_resource 'module.clients.auth0_client.this["email-template-service"]' \
                "${{ parameters.client_email_template_service }}" "email-template-service"
              import_resource 'module.clients.auth0_client.this["mulesoft-service"]' \
                "${{ parameters.client_mulesoft_service }}" "mulesoft-service"

              # Client grants
              import_resource 'module.client_grants.auth0_client_grant.this["branded-ui-service-mgmt-api"]' \
                "${{ parameters.grant_branded_ui_service }}" "branded-ui-service-mgmt-api"
              import_resource 'module.client_grants.auth0_client_grant.this["auth0-actions-service-mgmt-api"]' \
                "${{ parameters.grant_auth0_actions_service }}" "auth0-actions-service-mgmt-api"
              import_resource 'module.client_grants.auth0_client_grant.this["auth0-vault-service-mgmt-api"]' \
                "${{ parameters.grant_auth0_vault_service }}" "auth0-vault-service-mgmt-api"
              import_resource 'module.client_grants.auth0_client_grant.this["email-template-service-mgmt-api"]' \
                "${{ parameters.grant_email_template_service }}" "email-template-service-mgmt-api"
              import_resource 'module.client_grants.auth0_client_grant.this["mulesoft-service-mgmt-api"]' \
                "${{ parameters.grant_mulesoft_service }}" "mulesoft-service-mgmt-api"

              # Summary
              echo ""
              printf "Imported: %d | Skipped: %d | Failed: %d\n" "$imported" "$skipped" "$failed"
              [ "$failed" -gt 0 ] && echo "##[warning]${failed} import(s) failed."
            displayName: "Import resources"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
              AUTH0_DOMAIN: $(AUTH0_DOMAIN)
              AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
              AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
              TF_VAR_secrets_json: >-
                {
                  "SES_ACCESS_KEY_ID": "$(SES_ACCESS_KEY_ID)",
                  "SES_SECRET_ACCESS_KEY": "$(SES_SECRET_ACCESS_KEY)"
                }

  - stage: verify
    displayName: "Verify with plan"
    dependsOn: import
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          region: ${{ parameters.region }}
          environment: ${{ parameters.environment }}
          publish_binary_plan: false
