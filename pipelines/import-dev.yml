# ONE-TIME import pipeline for bootstrapping existing Auth0 resources into Terraform state.
# Pipeline name in Azure DevOps: "CIC - Import Dev (one-time)"
#
# Usage:
#   1. Get resource IDs from the Auth0 dev dashboard
#   2. Fill in the parameters below
#   3. Run this pipeline manually
#   4. Review the plan output to verify minimal drift
#   5. After successful import, this pipeline is no longer needed
#
# Where to find IDs:
#   Clients:          Dashboard → Applications → click app → Settings → Client ID
#   Action modules:   Dashboard → Actions → Library → Modules → click module → ID in URL
#   Actions:          Dashboard → Actions → Library → Custom → click action → ID in URL
#   Vault connection: Dashboard → Actions → Forms → Flows → Vault → click → ID (ac_xxxxx)
#   Flows:            Dashboard → Actions → Forms → Flows → click flow → ID (flow_xxxxx)
#   Forms:            Dashboard → Actions → Forms → click form → ID (ap_xxxxx)
trigger: none

parameters:
  # ── Clients ──
  - name: client_auth0_actions
    displayName: "Client ID: auth0-actions"
    type: string
    default: "SKIP"
  - name: client_auth0_vault
    displayName: "Client ID: auth0-vault"
    type: string
    default: "SKIP"
  - name: client_branded_ui_service
    displayName: "Client ID: branded-ui-service"
    type: string
    default: "SKIP"
  - name: client_email_template_service
    displayName: "Client ID: email-template-service"
    type: string
    default: "SKIP"
  - name: client_marlo
    displayName: "Client ID: marlo"
    type: string
    default: "SKIP"
  - name: client_mulesoft
    displayName: "Client ID: mulesoft"
    type: string
    default: "SKIP"

  # ── Action modules ──
  - name: module_entry_path_verification
    displayName: "Module ID: entry-path-verification"
    type: string
    default: "SKIP"
  - name: module_account_linking
    displayName: "Module ID: account-linking"
    type: string
    default: "SKIP"
  - name: module_signup_validation
    displayName: "Module ID: signup-validation"
    type: string
    default: "SKIP"

  # ── Actions ──
  - name: action_enrich_signup_profile
    displayName: "Action ID: enrich-signup-profile"
    type: string
    default: "SKIP"
  - name: action_enforce_email_verification
    displayName: "Action ID: enforce-email-verification"
    type: string
    default: "SKIP"
  - name: action_complete_social_profile
    displayName: "Action ID: complete-social-profile"
    type: string
    default: "SKIP"
  - name: action_link_accounts
    displayName: "Action ID: link-accounts"
    type: string
    default: "SKIP"
  - name: action_post_account_linking
    displayName: "Action ID: post-account-linking"
    type: string
    default: "SKIP"
  - name: action_custom_claims
    displayName: "Action ID: custom-claims"
    type: string
    default: "SKIP"
  - name: action_token_enrichment
    displayName: "Action ID: token-enrichment"
    type: string
    default: "SKIP"
  - name: action_token_check
    displayName: "Action ID: token-check"
    type: string
    default: "SKIP"

  # ── Vault connection ──
  - name: vault_auth0_m2m
    displayName: "Vault connection ID: auth0-m2m (ac_xxxxx)"
    type: string
    default: "SKIP"

  # ── Flows ──
  - name: flow_ev_send_email_otp
    displayName: "Flow ID: ev-send-email-otp"
    type: string
    default: "SKIP"
  - name: flow_ev_verify_otp_update
    displayName: "Flow ID: ev-verify-otp-update"
    type: string
    default: "SKIP"
  - name: flow_pp_update_user
    displayName: "Flow ID: pp-update-user"
    type: string
    default: "SKIP"
  - name: flow_pp_send_email_otp
    displayName: "Flow ID: pp-send-email-otp"
    type: string
    default: "SKIP"
  - name: flow_pp_verify_otp_update
    displayName: "Flow ID: pp-verify-otp-update"
    type: string
    default: "SKIP"

  # ── Forms ──
  - name: form_email_verification
    displayName: "Form ID: email-verification (ap_xxxxx)"
    type: string
    default: "SKIP"
  - name: form_progressive_profiling
    displayName: "Form ID: progressive-profiling (ap_xxxxx)"
    type: string
    default: "SKIP"
  - name: form_account_linking
    displayName: "Form ID: account-linking (ap_xxxxx)"
    type: string
    default: "SKIP"
  - name: form_post_account_linking
    displayName: "Form ID: post-account-linking (ap_xxxxx)"
    type: string
    default: "SKIP"

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: na-dev-axon-cic

stages:
  - stage: import
    displayName: "Import existing resources"
    jobs:
      - job: terraform_import
        displayName: "Import into Terraform state"
        steps:
          - template: templates/terraform-init.yml
            parameters:
              environment: dev

          - script: |
              #!/bin/bash
              set -euo pipefail
              cd $(Build.SourcesDirectory)/terraform

              imported=0
              skipped=0
              failed=0

              import_resource() {
                local address="$1"
                local id="$2"
                local label="$3"

                if [ "$id" = "SKIP" ]; then
                  echo "⏭  SKIP: $label"
                  skipped=$((skipped + 1))
                  return
                fi

                echo ""
                echo "━━━ Importing: $label ━━━"
                echo "  Address: $address"
                echo "  ID:      $id"

                if terraform import \
                  -var="environment=dev" \
                  "$address" "$id" 2>&1; then
                  echo "  ✓ Imported successfully"
                  imported=$((imported + 1))
                else
                  echo "##[warning]  ✗ Import failed for $label ($id)"
                  failed=$((failed + 1))
                fi
              }

              echo "╔══════════════════════════════════════════════════╗"
              echo "║  Auth0 Dev Import                               ║"
              echo "╚══════════════════════════════════════════════════╝"
              echo ""

              # ── Clients ──
              echo "── Clients ──"
              import_resource 'module.clients.auth0_client.this["auth0-actions"]' \
                "${{ parameters.client_auth0_actions }}" "auth0-actions"
              import_resource 'module.clients.auth0_client.this["auth0-vault"]' \
                "${{ parameters.client_auth0_vault }}" "auth0-vault"
              import_resource 'module.clients.auth0_client.this["branded-ui-service"]' \
                "${{ parameters.client_branded_ui_service }}" "branded-ui-service"
              import_resource 'module.clients.auth0_client.this["email-template-service"]' \
                "${{ parameters.client_email_template_service }}" "email-template-service"
              import_resource 'module.clients.auth0_client.this["marlo"]' \
                "${{ parameters.client_marlo }}" "marlo"
              import_resource 'module.clients.auth0_client.this["mulesoft"]' \
                "${{ parameters.client_mulesoft }}" "mulesoft"

              # ── Action modules ──
              echo ""
              echo "── Action modules ──"
              import_resource 'module.action_modules.auth0_action_module.this["entry-path-verification"]' \
                "${{ parameters.module_entry_path_verification }}" "entry-path-verification"
              import_resource 'module.action_modules.auth0_action_module.this["account-linking"]' \
                "${{ parameters.module_account_linking }}" "account-linking"
              import_resource 'module.action_modules.auth0_action_module.this["signup-validation"]' \
                "${{ parameters.module_signup_validation }}" "signup-validation"

              # ── Actions ──
              echo ""
              echo "── Actions ──"
              import_resource 'module.actions.auth0_action.this["enrich-signup-profile"]' \
                "${{ parameters.action_enrich_signup_profile }}" "enrich-signup-profile"
              import_resource 'module.actions.auth0_action.this["enforce-email-verification"]' \
                "${{ parameters.action_enforce_email_verification }}" "enforce-email-verification"
              import_resource 'module.actions.auth0_action.this["complete-social-profile"]' \
                "${{ parameters.action_complete_social_profile }}" "complete-social-profile"
              import_resource 'module.actions.auth0_action.this["link-accounts"]' \
                "${{ parameters.action_link_accounts }}" "link-accounts"
              import_resource 'module.actions.auth0_action.this["post-account-linking"]' \
                "${{ parameters.action_post_account_linking }}" "post-account-linking"
              import_resource 'module.actions.auth0_action.this["custom-claims"]' \
                "${{ parameters.action_custom_claims }}" "custom-claims"
              import_resource 'module.actions.auth0_action.this["token-enrichment"]' \
                "${{ parameters.action_token_enrichment }}" "token-enrichment"
              import_resource 'module.actions.auth0_action.this["token-check"]' \
                "${{ parameters.action_token_check }}" "token-check"

              # ── Trigger bindings ──
              echo ""
              echo "── Trigger bindings ──"
              # Only import if at least one action in that trigger was imported
              if [ "${{ parameters.action_enrich_signup_profile }}" != "SKIP" ]; then
                import_resource 'module.actions.auth0_trigger_actions.this["pre-user-registration"]' \
                  "pre-user-registration" "trigger: pre-user-registration"
              fi
              if [ "${{ parameters.action_enforce_email_verification }}" != "SKIP" ]; then
                import_resource 'module.actions.auth0_trigger_actions.this["post-login"]' \
                  "post-login" "trigger: post-login"
              fi

              # ── Vault connection ──
              echo ""
              echo "── Vault connection ──"
              import_resource 'module.vault_connections.auth0_flow_vault_connection.this["auth0-m2m"]' \
                "${{ parameters.vault_auth0_m2m }}" "auth0-m2m"

              # ── Flows ──
              echo ""
              echo "── Flows ──"
              import_resource 'module.flows.auth0_flow.this["ev-send-email-otp"]' \
                "${{ parameters.flow_ev_send_email_otp }}" "ev-send-email-otp"
              import_resource 'module.flows.auth0_flow.this["ev-verify-otp-update"]' \
                "${{ parameters.flow_ev_verify_otp_update }}" "ev-verify-otp-update"
              import_resource 'module.flows.auth0_flow.this["pp-update-user"]' \
                "${{ parameters.flow_pp_update_user }}" "pp-update-user"
              import_resource 'module.flows.auth0_flow.this["pp-send-email-otp"]' \
                "${{ parameters.flow_pp_send_email_otp }}" "pp-send-email-otp"
              import_resource 'module.flows.auth0_flow.this["pp-verify-otp-update"]' \
                "${{ parameters.flow_pp_verify_otp_update }}" "pp-verify-otp-update"

              # ── Forms ──
              echo ""
              echo "── Forms ──"
              import_resource 'module.forms.auth0_form.this["email-verification"]' \
                "${{ parameters.form_email_verification }}" "email-verification"
              import_resource 'module.forms.auth0_form.this["progressive-profiling"]' \
                "${{ parameters.form_progressive_profiling }}" "progressive-profiling"
              import_resource 'module.forms.auth0_form.this["account-linking"]' \
                "${{ parameters.form_account_linking }}" "account-linking"
              import_resource 'module.forms.auth0_form.this["post-account-linking"]' \
                "${{ parameters.form_post_account_linking }}" "post-account-linking"

              # ── Summary ──
              echo ""
              echo "╔══════════════════════════════════════════════════╗"
              echo "║  Import Summary                                 ║"
              echo "╠══════════════════════════════════════════════════╣"
              printf "║  Imported: %-38s║\n" "$imported"
              printf "║  Skipped:  %-38s║\n" "$skipped"
              printf "║  Failed:   %-38s║\n" "$failed"
              echo "╚══════════════════════════════════════════════════╝"

              if [ "$failed" -gt 0 ]; then
                echo "##[warning]$failed import(s) failed. Review the output above and fix before running plan."
              fi
            displayName: "Import resources"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
              AUTH0_DOMAIN: $(AUTH0_DOMAIN)
              AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
              AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
              TF_VAR_secrets_json: >-
                {
                  "VAULT_AUTH0_CLIENT_SECRET": "$(VAULT_AUTH0_CLIENT_SECRET)",
                  "MANAGEMENT_API_CLIENT_SECRET": "$(MANAGEMENT_API_CLIENT_SECRET)"
                }

  - stage: verify
    displayName: "Verify with plan"
    dependsOn: import
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          environment: dev
          region: na
          publish_binary_plan: false
