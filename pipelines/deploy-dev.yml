# Auto-triggers plan on merge to master. Apply requires approval.
# Pipeline name in Azure DevOps: "CIC - Deploy Dev"
#
# The apply stage uses environment: na-dev-axon-cic which enforces
# the approval checks configured on that environment.
# Configure at least a basic approval on na-dev-axon-cic so that
# the plan output can be reviewed before apply runs.
trigger:
  branches:
    include:
      - master
  paths:
    include:
      - terraform/**

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: na-dev-axon-cic

stages:
  - stage: security_and_quality
    displayName: "Security & quality"
    jobs:
      - template: templates/security-scan.yml

  - stage: terraform_validation
    displayName: "Terraform validation"
    dependsOn: security_and_quality
    jobs:
      - template: templates/terraform-validate.yml
        parameters:
          environment: dev

  - stage: terraform_plan
    displayName: "Terraform plan (dev)"
    dependsOn: terraform_validation
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          environment: dev
          region: na

  - stage: terraform_apply
    displayName: "Terraform apply (dev)"
    dependsOn: terraform_plan
    jobs:
      - template: templates/terraform-apply.yml
        parameters:
          environment: dev
          region: na
