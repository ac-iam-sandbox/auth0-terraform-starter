# Auto-triggers plan on merge to main. Apply requires approval.
# Pipeline name in Azure DevOps: "Platform Ops - Deploy Dev"
#
# Runs for a single region. Create one pipeline instance per region,
# each referencing the same YAML but with a different default region,
# OR use a single pipeline that deploys all regions in parallel stages.
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pr: none

parameters:
  - name: region
    displayName: "Region"
    type: string
    default: "na"
    values:
      - na
      - apac
      - eu

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: ${{ parameters.region }}-dev-axon-platform-ops

stages:
  - stage: security_and_quality
    displayName: "Security & quality"
    jobs:
      - template: templates/security-scan.yml

  - stage: terraform_validation
    displayName: "Terraform validation"
    dependsOn: security_and_quality
    jobs:
      - template: templates/terraform-validate.yml
        parameters:
          region: ${{ parameters.region }}
          environment: dev

  - stage: terraform_plan
    displayName: "Terraform plan (${{ parameters.region }}-dev)"
    dependsOn: terraform_validation
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          region: ${{ parameters.region }}
          environment: dev

  - stage: terraform_apply
    displayName: "Terraform apply (${{ parameters.region }}-dev)"
    dependsOn: terraform_plan
    jobs:
      - template: templates/terraform-apply.yml
        parameters:
          region: ${{ parameters.region }}
          environment: dev
