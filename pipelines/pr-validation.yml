# Runs on pull requests: security scan + validate + plan dev and qa.
# Binary plan artifacts are NOT published for PRs (no apply stage).
# Note: This pipeline is for PR validation only. It does NOT include an apply stage.

trigger: none

pr:
  branches:
    include:
      - master
  paths:
    include:
      - terraform/**

pool:
  vmImage: "ubuntu-latest"

stages:
  # ── Stage 1: Security & quality (no credentials needed) ───────────
  - stage: security_and_quality
    displayName: "Security & quality"
    jobs:
      - template: templates/security-scan.yml

  # ── Stage 2: Terraform validation (uses dev for init) ─────────────
  - stage: terraform_validation
    displayName: "Terraform validation"
    dependsOn: security_and_quality
    variables:
      - group: na-dev-axon-cic
    jobs:
      - template: templates/terraform-validate.yml
        parameters:
          environment: dev

  # ── Stage 3: Plan dev ─────────────────────────────────────────────
  - stage: plan_dev
    displayName: "Plan (dev)"
    dependsOn: terraform_validation
    variables:
      - group: na-dev-axon-cic
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          environment: dev
          region: na
          publish_binary_plan: false

  # ── Stage 4: Plan qa (parallel with dev completing) ───────────────
  - stage: plan_qa
    displayName: "Plan (qa)"
    dependsOn: plan_dev
    variables:
      - group: na-qa-axon-cic
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          environment: qa
          region: na
          publish_binary_plan: false

  # ── Stage 5: Post plan summary as PR comment ──────────────────────
  - stage: pr_comment
    displayName: "PR comment"
    dependsOn:
      - plan_dev
      - plan_qa
    condition: succeededOrFailed()
    jobs:
      - template: templates/pr-comment.yml
        parameters:
          region: na
