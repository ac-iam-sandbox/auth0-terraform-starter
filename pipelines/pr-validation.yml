# Runs on pull requests: security scan + validate + plan dev and qa for selected region.
# Pipeline name in Azure DevOps: "Platform Ops - PR Validation"
trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

parameters:
  - name: region
    displayName: "Region to validate"
    type: string
    default: "na"
    values:
      - na
      - apac
      - eu

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: security_and_quality
    displayName: "Security & quality"
    jobs:
      - template: templates/security-scan.yml

  - stage: terraform_validation
    displayName: "Terraform validation"
    dependsOn: security_and_quality
    variables:
      - group: ${{ parameters.region }}-dev-axon-platform-ops
    jobs:
      - template: templates/terraform-validate.yml
        parameters:
          region: ${{ parameters.region }}
          environment: dev

  - stage: plan_dev
    displayName: "Plan (${{ parameters.region }}-dev)"
    dependsOn: terraform_validation
    variables:
      - group: ${{ parameters.region }}-dev-axon-platform-ops
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          region: ${{ parameters.region }}
          environment: dev
          publish_binary_plan: false

  - stage: plan_qa
    displayName: "Plan (${{ parameters.region }}-qa)"
    dependsOn: plan_dev
    variables:
      - group: ${{ parameters.region }}-qa-axon-platform-ops
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          region: ${{ parameters.region }}
          environment: qa
          publish_binary_plan: false

  - stage: pr_comment
    displayName: "PR comment"
    dependsOn:
      - plan_dev
      - plan_qa
    condition: succeededOrFailed()
    jobs:
      - template: templates/pr-comment.yml
        parameters:
          region: ${{ parameters.region }}
