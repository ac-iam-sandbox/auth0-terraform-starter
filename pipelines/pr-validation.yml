# Runs on pull requests: security scan + validate + plan against dev.
# Pipeline name in Azure DevOps: "CIC - PR Validation"
trigger: none

pr:
  branches:
    include:
      - master
  paths:
    include:
      - terraform/**

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: na-dev-axon-cic

stages:
  - stage: security_and_quality
    displayName: "Security & quality"
    jobs:
      - template: templates/security-scan.yml

  - stage: terraform_validation
    displayName: "Terraform validation"
    dependsOn: security_and_quality
    jobs:
      - template: templates/terraform-validate.yml
        parameters:
          environment: dev

  - stage: terraform_plan
    displayName: "Terraform plan (dev)"
    dependsOn: terraform_validation
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          environment: dev
          region: na
