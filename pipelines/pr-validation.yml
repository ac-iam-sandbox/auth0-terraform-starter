# Runs on pull requests: security scan + validate + plan dev and qa.
# Pipeline name in Azure DevOps: "Platform Ops - PR Validation"
trigger: none

pr:
  branches:
    include:
      - master
  paths:
    include:
      - terraform/**

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: security_and_quality
    displayName: "Security & quality"
    jobs:
      - template: templates/security-scan.yml

  - stage: terraform_validation
    displayName: "Terraform validation"
    dependsOn: security_and_quality
    variables:
      - group: na-dev-axon-platform-ops
    jobs:
      - template: templates/terraform-validate.yml
        parameters:
          environment: dev

  - stage: plan_dev
    displayName: "Plan (dev)"
    dependsOn: terraform_validation
    variables:
      - group: na-dev-axon-platform-ops
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          environment: dev
          region: na
          publish_binary_plan: false

  - stage: plan_qa
    displayName: "Plan (qa)"
    dependsOn: plan_dev
    variables:
      - group: na-qa-axon-platform-ops
    jobs:
      - template: templates/terraform-plan.yml
        parameters:
          environment: qa
          region: na
          publish_binary_plan: false

  - stage: pr_comment
    displayName: "PR comment"
    dependsOn:
      - plan_dev
      - plan_qa
    condition: succeededOrFailed()
    jobs:
      - template: templates/pr-comment.yml
        parameters:
          region: na
