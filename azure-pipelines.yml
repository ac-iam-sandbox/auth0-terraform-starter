# =============================================================================
# Azure Pipelines: Auth0 Terraform CI/CD
# =============================================================================
# Trunk-based development workflow:
#   PR to master  -> Build + Validate + Security Scan + Plan Preview
#   Merge to master -> Build + Validate + Security -> Deploy DEV -> QA -> VAL -> PROD
# =============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  - group: terraform-common-axon-cic
  - name: NODE_VERSION
    value: '20.x'
  - name: TF_VERSION
    value: '1.13.3'
  - name: TG_VERSION
    value: '0.78.4'
  - name: TF_IN_AUTOMATION
    value: '1'
  - name: CONFTEST_VERSION
    value: '0.56.0'

stages:
  # ========================================
  # Stage 1: Build TypeScript Actions + Modules
  # ========================================
  - stage: Build
    displayName: Build Actions & Modules
    jobs:
      - job: BuildActions
        displayName: Build and Test Actions
        steps:
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: npm-v2 | "$(Agent.OS)" | actions/package-lock.json
              path: $(Pipeline.Workspace)/.npm

          - script: |
              set -euo pipefail
              cd actions
              rm -rf node_modules
              npm ci --include=optional --cache $(Pipeline.Workspace)/.npm
              node -e "require.resolve('rollup'); require.resolve('@rollup/rollup-linux-x64-gnu')"
              npm run build
            displayName: Build Actions & Modules

          - script: |
              set -euo pipefail
              cd actions
              npm test
            displayName: Run Tests

          - script: |
              set -euo pipefail
              cd actions
              npm run test:coverage || true
            displayName: Generate Coverage Report
            continueOnError: true

          - task: PublishTestResults@2
            displayName: Publish Test Results
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: actions/test-results/*.xml
              failTaskOnFailedTests: true
            condition: succeededOrFailed()

          - publish: actions/dist
            artifact: actions-dist
            displayName: Publish Actions Artifact
  # ========================================
  # Stage 2: Security, Quality, and Schema Checks
  # ========================================
  - stage: SecurityScan
    displayName: Security & Quality
    dependsOn: Build
    jobs:
      - job: SecurityChecks
        displayName: Security Scanning
        steps:
          - script: |
              set -euo pipefail
              pip install checkov --break-system-packages
            displayName: Install Checkov

          - script: |
              set -euo pipefail
              checkov -d modules/ \
                --framework terraform \
                --soft-fail \
                --output cli \
                --output junitxml \
                --output-file-path $(Build.ArtifactStagingDirectory)
            displayName: Checkov Module Security Scan
            continueOnError: true

          - task: PublishTestResults@2
            displayName: Publish Security Scan Results
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/results_junitxml.xml
              testRunTitle: Checkov Security Scan
              failTaskOnFailedTests: false
            condition: succeededOrFailed()

      - job: LintAndValidate
        displayName: Lint, Format, and Schema Validation
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(TF_VERSION)

          - script: |
              set -euo pipefail
              terraform fmt -check -recursive -diff modules/
            displayName: Terraform Format Check

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: |
              set -euo pipefail
              cd actions
              npm ci --include=optional --cache $(Pipeline.Workspace)/.npm
              npm run lint || echo "ESLint warnings found (non-blocking)"
            displayName: ESLint Check
            continueOnError: true

          - script: |
              set -euo pipefail
              node scripts/validate-schemas.mjs
            displayName: Validate JSON Schemas

          - script: |
              set -euo pipefail
              node scripts/verify-manifests.mjs
            displayName: Verify Promotion Manifests

  # ========================================
  # Stage 3: Terraform Validation + OPA Policy
  # ========================================
  - stage: Validate
    displayName: Terraform Validation
    dependsOn: SecurityScan
    jobs:
      - job: ValidateAll
        displayName: Validate All Modules
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(TF_VERSION)

          - script: |
              set -euo pipefail
              for mod in modules/*/; do
                echo "Validating: $mod"
                cd "$mod"
                # Inject provider config (normally generated by root.hcl via Terragrunt)
                cat > provider.tf <<'PROVIDEREOF'
              terraform {
                required_version = ">= 1.5.0"
                required_providers {
                  auth0 = {
                    source  = "auth0/auth0"
                    version = "~> 1.14"
                  }
                }
              }
              provider "auth0" {}
              PROVIDEREOF
                terraform init -backend=false -input=false -no-color
                terraform validate -no-color
                rm -f provider.tf
                cd ../..
              done
            displayName: Validate All Modules

          - script: |
              set -euo pipefail
              CONFTEST_URL="https://github.com/open-policy-agent/conftest/releases/download/v$(CONFTEST_VERSION)/conftest_$(CONFTEST_VERSION)_Linux_x86_64.tar.gz"
              curl -sL "$CONFTEST_URL" | tar xz -C /usr/local/bin conftest
              conftest --version
            displayName: Install Conftest

          - script: |
              echo "Conftest installed — OPA policies will run against plan output in deploy stages."
              echo "To test locally: conftest test tfplan.json --policy ./policies/"
            displayName: OPA Policy Check (info)

  # ========================================
  # Stage 4: Plan Preview (PR only)
  # ========================================
  - stage: PlanPreview
    displayName: Plan Preview (PR)
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: PlanDev
        displayName: Preview DEV Plan
        variables:
          - group: na-dev-axon-cic
        steps:
          - download: current
            artifact: actions-dist

          - script: |
              set -euo pipefail
              mkdir -p actions/dist
              cp -r "$(Pipeline.Workspace)/actions-dist/"* actions/dist/
            displayName: Restore Actions Build

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(TF_VERSION)

          - script: |
              set -euo pipefail
              curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v$(TG_VERSION)/terragrunt_linux_amd64" \
                -o /usr/local/bin/terragrunt
              chmod +x /usr/local/bin/terragrunt
            displayName: Install Terragrunt

          - script: |
              set -euo pipefail
              cd environments/dev
              terragrunt stack generate
              mkdir -p .terragrunt-stack
              terragrunt run --all --non-interactive --no-color -- plan \
                -input=false \
                -lock=false \
                2>&1 | tee "$(Build.ArtifactStagingDirectory)/dev-plan-preview.txt"
            displayName: Generate DEV Plan Preview
            env:
              TF_IN_AUTOMATION: '1'
              AUTH0_DOMAIN: $(AUTH0_DOMAIN)
              AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
              AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: plan-preview-dev
            displayName: Publish DEV Plan Preview

  # ========================================
  # Stage 5: CI Summary
  # ========================================
  - stage: CISummary
    displayName: CI Summary
    dependsOn:
      - Build
      - SecurityScan
      - Validate
    condition: succeededOrFailed()
    jobs:
      - job: Summary
        displayName: Pipeline Summary
        steps:
          - script: |
              echo "========================================"
              echo "CI Pipeline Summary"
              echo "========================================"
              echo "Build: $(Build.BuildNumber)"
              echo "Branch: $(Build.SourceBranchName)"
              echo "Commit: $(Build.SourceVersion)"
              echo "Trigger: $(Build.Reason)"
              echo "========================================"
            displayName: Display Summary

  # ========================================
  # CD STAGES (master branch only, sequential)
  # ========================================
  - stage: DeployDev
    displayName: Deploy to DEV
    dependsOn:
      - Build
      - SecurityScan
      - Validate
      - CISummary
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - template: pipelines/templates/deploy-environment.yml
        parameters:
          environment: dev
          environmentName: DEV
          variableGroup: na-dev-axon-cic
          azureEnvironment: na-dev-axon-cic
          isProduction: false

  - stage: DeployQA
    displayName: Deploy to QA
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - template: pipelines/templates/deploy-environment.yml
        parameters:
          environment: qa
          environmentName: QA
          variableGroup: na-qa-axon-cic
          azureEnvironment: na-qa-axon-cic
          isProduction: false

  - stage: DeployVal
    displayName: Deploy to VAL
    dependsOn: DeployQA
    condition: succeeded()
    jobs:
      - template: pipelines/templates/deploy-environment.yml
        parameters:
          environment: val
          environmentName: VAL
          variableGroup: na-val-axon-cic
          azureEnvironment: na-val-axon-cic
          isProduction: false

  - stage: DeployProd
    displayName: Deploy to PROD
    dependsOn: DeployVal
    condition: succeeded()
    jobs:
      - template: pipelines/templates/deploy-environment.yml
        parameters:
          environment: prod
          environmentName: PROD
          variableGroup: na-prod-axon-cic
          azureEnvironment: na-prod-axon-cic
          isProduction: true