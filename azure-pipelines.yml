name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - master
      - develop
      - feature/*
  paths:
    include:
      - actions/**
      - modules/**
      - environments/**
      - azure-pipelines.yml

pr:
  branches:
    include:
      - master
      - develop
  paths:
    include:
      - actions/**
      - modules/**
      - environments/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: terraform-common-cic
  - name: NODE_VERSION
    value: '20.x'
  - name: TF_VERSION
    value: '1.13.3'

stages:
  # ========================================
  # CI STAGES (Always Run)
  # ========================================

  # Stage 1: Build TypeScript Actions
  # ========================================
  - stage: Build
    displayName: 'Build Actions'
    jobs:
      - job: BuildActions
        displayName: 'Build TypeScript Actions'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: 'Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | actions/package-lock.json'
              path: actions/node_modules
              restoreKeys: |
                npm | "$(Agent.OS)"

          - script: |
              set -euo pipefail
              cd actions
              echo "Installing dependencies..."
              npm ci
              echo "Building actions..."
              npm run build
            displayName: 'Build Actions'

          - script: |
              set -euo pipefail
              cd actions
              echo "Running unit tests..."
              npm test
            displayName: 'Run Unit Tests'

          - script: |
              set -euo pipefail
              cd actions
              echo "Generating test coverage..."
              npm run test:coverage || true
            displayName: 'Generate Coverage Report'
            continueOnError: true

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Coverage Results'
            inputs:
              summaryFileLocation: 'actions/coverage/cobertura-coverage.xml'
              failIfCoverageEmpty: false
            condition: succeededOrFailed()

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'actions/test-results/*.xml'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()

          - publish: actions/dist
            artifact: actions-dist
            displayName: 'Publish Actions Artifact'

  # ========================================
  # Stage 2: Security & Quality Checks
  # ========================================
  - stage: SecurityScan
    displayName: 'Security & Quality'
    dependsOn: Build
    jobs:
      - job: SecurityChecks
        displayName: 'Security Scanning'
        steps:
          - script: |
              set -euo pipefail
              echo "========================================"
              echo "Installing Checkov (Terraform Security Scanner)"
              echo "========================================"
              pip install checkov --break-system-packages
              
              echo ""
              echo "Checkov version:"
              checkov --version
              echo "========================================"
            displayName: 'Install Checkov'

          - script: |
              set -euo pipefail
              echo "========================================"
              echo "Running Checkov Security Scan"
              echo "========================================"
              echo "Scanning: environments/"
              echo ""
              
              checkov -d environments/ \
                --framework terraform \
                --soft-fail \
                --output cli \
                --output junitxml \
                --output-file-path $(Build.ArtifactStagingDirectory)
              
              echo ""
              echo "Scan complete. Results saved to artifacts."
              echo "========================================"
            displayName: 'Checkov: Terraform Security Scan'
            continueOnError: true

          - task: PublishTestResults@2
            displayName: 'Publish Security Scan Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/results_junitxml.xml'
              testRunTitle: 'Checkov Security Scan'
              failTaskOnFailedTests: false
            condition: succeededOrFailed()

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: security-scan-results
            displayName: 'Publish Scan Artifacts'
            condition: succeededOrFailed()

      - job: LintCheck
        displayName: 'Linting & Formatting'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform $(TF_VERSION)'
            inputs:
              terraformVersion: $(TF_VERSION)

          - script: |
              set -euo pipefail
              echo "========================================"
              echo "Checking Terraform Formatting"
              echo "========================================"
              terraform fmt -check -recursive -diff
              echo ""
              echo "✓ Terraform formatting is correct"
            displayName: 'Terraform Format Check'

          - script: |
              set -euo pipefail
              cd actions
              echo "Running ESLint..."
              npm run lint || echo "⚠ ESLint warnings found (non-blocking)"
            displayName: 'ESLint Check'
            continueOnError: true

  # ========================================
  # Stage 3: Terraform Validation
  # ========================================
  - stage: Validate
    displayName: 'Terraform Validation'
    dependsOn: SecurityScan
    jobs:
      - job: ValidateAll
        displayName: 'Validate All Environments'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform $(TF_VERSION)'
            inputs:
              terraformVersion: $(TF_VERSION)

          - script: |
              set -euo pipefail
              
              echo "========================================"
              echo "Terraform Validation - All Environments"
              echo "========================================"
              echo ""
              
              for env in dev qa val prod; do
                echo "----------------------------------------"
                echo "Validating: $env"
                echo "----------------------------------------"
                
                cd environments/$env
                
                echo "Initializing (no backend)..."
                terraform init -backend=false -input=false -no-color
                
                echo "Running validation..."
                terraform validate -no-color
                
                echo "✓ $env validation passed"
                cd ../..
                echo ""
              done
              
              echo "========================================"
              echo "✓ All environments validated successfully"
              echo "========================================"
            displayName: 'Validate Terraform Configurations'

  # ========================================
  # Stage 4: Plan Preview (PR only)
  # ========================================
  - stage: PlanPreview
    displayName: 'Plan Preview (PR)'
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: PreviewDev
        displayName: 'Preview DEV Changes'
        variables:
          - group: na-dev-cic
        steps:
          - download: current
            artifact: actions-dist

          - script: |
              set -euo pipefail
              mkdir -p actions/dist
              cp -r "$(Pipeline.Workspace)/actions-dist/"* actions/dist/
            displayName: 'Restore Actions Build'

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: AzureCLI@2
            displayName: 'Generate DEV Plan Preview'
            inputs:
              azureSubscription: 'dev-azure-resource-service-connection'
              scriptType: 'bash'
              addSpnToEnvironment: true
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail

                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_OIDC_TOKEN=$idToken
                export ARM_USE_OIDC=true
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                cd environments/dev

                echo "========================================"
                echo "Plan Preview - DEV"
                echo "========================================"

                terraform init \
                  -backend-config="resource_group_name=$(ARM_RESOURCE_GROUP)" \
                  -backend-config="storage_account_name=$(ARM_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(ARM_CONTAINER_NAME)" \
                  -backend-config="use_azuread_auth=true" \
                  -backend-config="use_oidc=true" \
                  -backend-config="client_id=$servicePrincipalId" \
                  -backend-config="tenant_id=$tenantId" \
                  -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
                  -input=false -no-color

                echo ""
                echo "Generating plan preview (read-only)..."
                terraform plan \
                  -input=false \
                  -no-color \
                  -lock=false \
                  -var-file=dev.platform.tfvars.json \
                  -out=tfplan-preview

                echo ""
                echo "Exporting plan..."
                terraform show -json tfplan-preview > "$(Build.ArtifactStagingDirectory)/dev-plan-preview.json"
                terraform show -no-color tfplan-preview > "$(Build.ArtifactStagingDirectory)/dev-plan-preview.txt"

                echo ""
                echo "✓ Plan preview generated"
                echo "========================================"
            env:
              TF_IN_AUTOMATION: '1'
              AUTH0_DOMAIN: $(AUTH0_DOMAIN)
              AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
              AUTH0_CLIENT_SECRET: $(AUTH0_CLIENT_SECRET)

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: plan-preview-dev
            displayName: 'Publish Plan Preview'

  # ========================================
  # Stage 5: CI Summary
  # ========================================
  - stage: CISummary
    displayName: 'CI Summary'
    dependsOn:
      - Build
      - SecurityScan
      - Validate
    condition: succeededOrFailed()
    jobs:
      - job: Summary
        displayName: 'Pipeline Summary'
        steps:
          - script: |
              set -euo pipefail
              
              echo "========================================"
              echo "CI Pipeline Summary"
              echo "========================================"
              echo "Build ID: $(Build.BuildId)"
              echo "Build Number: $(Build.BuildNumber)"
              echo "Source Branch: $(Build.SourceBranchName)"
              echo "Commit: $(Build.SourceVersion)"
              echo "Triggered by: $(Build.Reason)"
              echo "========================================"
              echo ""
              echo "✓ Actions built and tested"
              echo "✓ Security scans completed"
              echo "✓ Terraform validated"
              
              if [ "$(Build.Reason)" = "PullRequest" ]; then
                echo "✓ Plan preview generated"
                echo ""
                echo "→ Review artifacts before merging"
              fi
              
              if [ "$(Build.SourceBranchName)" = "master" ] && [ "$(Build.Reason)" != "PullRequest" ]; then
                echo ""
                echo "→ Deployment stages will follow"
              fi
              
              echo ""
              echo "Pipeline completed successfully!"
              echo "========================================"
            displayName: 'Display Summary'
  # ========================================
  # TEMPORARY: Service Principal Diagnostics
  # Remove after permissions are verified
  # ========================================
  - stage: DiagnoseDev
    displayName: 'Diagnose DEV Permissions'
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: DiagnosePermissions
        displayName: 'Check SP Roles & Storage Access'
        variables:
          - group: na-dev-cic
        steps:
          - task: AzureCLI@2
            displayName: 'List Service Principal Permissions'
            inputs:
              azureSubscription: 'dev-azure-resource-service-connection'
              scriptType: 'bash'
              addSpnToEnvironment: true
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail

                echo "========================================"
                echo "1. SERVICE PRINCIPAL IDENTITY"
                echo "========================================"
                echo "Client ID (App ID): $servicePrincipalId"
                echo "Tenant ID:          $tenantId"
                echo ""

                echo "Current account context:"
                az account show -o table
                echo ""

                ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                echo "Subscription ID: $ARM_SUBSCRIPTION_ID"
                echo ""

                echo "Service Principal details:"
                az ad sp show --id $servicePrincipalId \
                  --query '{displayName:displayName, objectId:id, appId:appId, type:servicePrincipalType}' \
                  -o table 2>/dev/null || echo "⚠ Could not query Azure AD"
                echo ""

                echo "========================================"
                echo "2. ALL ROLE ASSIGNMENTS FOR THIS SP"
                echo "========================================"
                az role assignment list \
                  --assignee $servicePrincipalId \
                  --all \
                  --query '[].{role:roleDefinitionName, scope:scope}' \
                  -o table 2>/dev/null || echo "⚠ Could not list role assignments"

                echo ""
                echo "========================================"
                echo "3. STORAGE ACCOUNT SPECIFIC ROLES"
                echo "========================================"
                echo "Storage Account: $(ARM_STORAGE_ACCOUNT)"
                echo "Resource Group:  $(ARM_RESOURCE_GROUP)"
                echo ""

                STORAGE_SCOPE="/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$(ARM_RESOURCE_GROUP)/providers/Microsoft.Storage/storageAccounts/$(ARM_STORAGE_ACCOUNT)"
                echo "Storage scope: $STORAGE_SCOPE"
                echo ""

                echo "Roles on this storage account:"
                az role assignment list \
                  --assignee $servicePrincipalId \
                  --scope "$STORAGE_SCOPE" \
                  --query '[].{role:roleDefinitionName, scope:scope}' \
                  -o table 2>/dev/null || echo "⚠ Could not list storage roles"

                echo ""
                echo "========================================"
                echo "4. DATA PLANE ROLE CHECK"
                echo "========================================"

                HAS_BLOB_CONTRIBUTOR=$(az role assignment list \
                  --assignee $servicePrincipalId \
                  --scope "$STORAGE_SCOPE" \
                  --query "[?roleDefinitionName=='Storage Blob Data Contributor'].roleDefinitionName" \
                  -o tsv 2>/dev/null)

                HAS_BLOB_READER=$(az role assignment list \
                  --assignee $servicePrincipalId \
                  --scope "$STORAGE_SCOPE" \
                  --query "[?roleDefinitionName=='Storage Blob Data Reader'].roleDefinitionName" \
                  -o tsv 2>/dev/null)

                HAS_BLOB_OWNER=$(az role assignment list \
                  --assignee $servicePrincipalId \
                  --scope "$STORAGE_SCOPE" \
                  --query "[?roleDefinitionName=='Storage Blob Data Owner'].roleDefinitionName" \
                  -o tsv 2>/dev/null)

                HAS_CONTRIBUTOR=$(az role assignment list \
                  --assignee $servicePrincipalId \
                  --scope "$STORAGE_SCOPE" \
                  --query "[?roleDefinitionName=='Contributor'].roleDefinitionName" \
                  -o tsv 2>/dev/null)

                HAS_OWNER=$(az role assignment list \
                  --assignee $servicePrincipalId \
                  --scope "$STORAGE_SCOPE" \
                  --query "[?roleDefinitionName=='Owner'].roleDefinitionName" \
                  -o tsv 2>/dev/null)

                echo "Storage Blob Data Contributor: ${HAS_BLOB_CONTRIBUTOR:-❌ NOT ASSIGNED}"
                echo "Storage Blob Data Reader:      ${HAS_BLOB_READER:-❌ NOT ASSIGNED}"
                echo "Storage Blob Data Owner:       ${HAS_BLOB_OWNER:-❌ NOT ASSIGNED}"
                echo "Contributor (mgmt plane only): ${HAS_CONTRIBUTOR:-not assigned}"
                echo "Owner (mgmt plane only):       ${HAS_OWNER:-not assigned}"

                echo ""
                echo "========================================"
                echo "5. STORAGE ACCOUNT SETTINGS"
                echo "========================================"
                az storage account show \
                  --name $(ARM_STORAGE_ACCOUNT) \
                  --resource-group $(ARM_RESOURCE_GROUP) \
                  --query '{name:name, allowSharedKeyAccess:allowSharedKeyAccess, defaultAction:networkRuleSet.defaultAction, bypass:networkRuleSet.bypass}' \
                  -o table 2>/dev/null || echo "⚠ Could not query storage account"

                echo ""
                echo "Container '$(ARM_CONTAINER_NAME)' accessible?"
                az storage container show \
                  --name $(ARM_CONTAINER_NAME) \
                  --account-name $(ARM_STORAGE_ACCOUNT) \
                  --auth-mode login \
                  -o table 2>/dev/null || echo "⚠ Could not access container"

                echo ""
                echo "========================================"
                echo "END OF DIAGNOSTICS"
                echo "========================================"# ========================================
  # CD STAGES (Only on master branch)
  # ========================================

  # Stage 6: Deploy to DEV
  # ========================================
  - stage: DeployDev
    displayName: 'Deploy to DEV'
    dependsOn:
      - Build
      - SecurityScan
      - Validate
      - CISummary
      - DiagnoseDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - template: templates/terraform-deploy.yml
        parameters:
          environment: 'na-dev-cic'
          serviceConnection: 'dev-azure-resource-service-connection'
          variableGroup: 'na-dev-cic'
          envFolder: 'dev'
          varFile: 'dev.platform.tfvars.json'
          displayName: 'DEV'

  # ========================================
  # Stage 7: Deploy to QA
  # ========================================
  - stage: DeployQA
    displayName: 'Deploy to QA'
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - template: templates/terraform-deploy.yml
        parameters:
          environment: 'na-qa-cic'
          serviceConnection: 'dev-azure-resource-service-connection'
          variableGroup: 'na-qa-cic'
          envFolder: 'qa'
          varFile: 'qa.platform.tfvars.json'
          displayName: 'QA'

  # ========================================
  # Stage 8: Deploy to PROD
  # ========================================
  - stage: DeployProd
    displayName: 'Deploy to PROD'
    dependsOn: DeployQA
    condition: succeeded()
    jobs:
      - template: templates/terraform-deploy.yml
        parameters:
          environment: 'na-prod-cic'
          serviceConnection: 'dev-azure-resource-service-connection'
          variableGroup: 'na-prod-cic'
          envFolder: 'prod'
          varFile: 'prod.platform.tfvars.json'
          displayName: 'PROD'
          isProduction: true
